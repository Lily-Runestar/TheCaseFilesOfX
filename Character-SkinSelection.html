<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character and Skin Selection</title>
  <style>
    html,body{height:100%;margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    main{height:100%;display:grid;grid-template-rows:auto 1fr 150px}
    header{padding:12px;text-align:center}.back{position:absolute;left:16px;top:16px}
    #skins{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:18px;padding:20px}
    .skin{width:150px;height:180px;background:#292929;border:2px solid #777;color:#fff}
    .skin img{width:110px;height:110px;object-fit:contain}
    #cycle{display:flex;justify-content:center;gap:10px;background:#181818;border-top:2px solid #777;padding:20px}
    #cycle button{width:95px;height:95px;background:#292929;border:2px solid #777;color:#fff;font-size:24px}
    #cycle button.exchange{border-color:#ffd700}
    a.back{color:#fff;background:#292929;border:1px solid #777;padding:10px;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <header><a class="back" href="index.html">BACK</a><h1>CHARACTERS / SKINS</h1><p id="status"></p></header>
    <div id="skins"></div>
    <div id="cycle" aria-label="Number cycle"></div>
  </main>
  <script src="player controls/player-controls.js"></script>
  <script>
    const status = document.getElementById("status");
    const skinsElement = document.getElementById("skins");
    const cycleElement = document.getElementById("cycle");
    let settings = loadPlayerSettings();
    let exchangeIndex = null;
    let selectedNumber = null;

    async function skinFolders(number) {
      try {
        const response = await fetch(`Case67/Media/Player/${number}/`);
        const html = await response.text();
        const folders = [...html.matchAll(/href="([^"]+)\/"/gi)].map((match) => decodeURIComponent(match[1].replace(/\/$/, ""))).filter((name) => name !== "../");
        return folders.length ? folders : ["Standard"];
      } catch (error) {
        return ["Standard"];
      }
    }

    async function showSkins(number) {
      selectedNumber = number;
      skinsElement.innerHTML = "";
      status.textContent = `Choose a skin for ${number === -1 ? "X" : "Number " + number}`;
      (await skinFolders(number)).forEach((folder) => {
        const button = document.createElement("button");
        button.className = "skin";
        button.innerHTML = `<img alt=""><div>${folder}</div>`;
        const preview = button.querySelector("img");
        preview.src = `Case67/Media/Player/${number}/${folder}/${number}_Still.png`;
        preview.onerror = () => { preview.style.display = "none"; };
        button.addEventListener("click", () => {
          settings.skins[String(number)] = folder;
          savePlayerSettings(settings);
          status.textContent = `${number === -1 ? "X" : "Number " + number}: ${folder}`;
          showSkins(number);
        });
        skinsElement.appendChild(button);
      });
    }

    function renderCycle() {
      cycleElement.innerHTML = "";
      const displayedCycle = [...settings.cycle];
      while (displayedCycle.length < 5) displayedCycle.push([1, 2, 3, 4, 5][displayedCycle.length]);
      displayedCycle.slice(0, 5).forEach((number, index) => {
        const button = document.createElement("button");
        button.textContent = number === -1 ? "X" : number;
        button.classList.toggle("exchange", exchangeIndex === index);
        button.addEventListener("click", () => {
          if (exchangeIndex !== null) {
            if (exchangeIndex !== index) {
              [settings.cycle[exchangeIndex], settings.cycle[index]] = [settings.cycle[index], settings.cycle[exchangeIndex]];
              savePlayerSettings(settings);
              exchangeIndex = null;
              status.textContent = "Cycle order updated.";
              renderCycle();
            } else {
              exchangeIndex = null;
              status.textContent = `Choose a skin for ${number === -1 ? "X" : "Number " + number}.`;
              renderCycle();
              showSkins(number);
            }
            } else {
              exchangeIndex = index;
              status.textContent = `Click another cycle slot to swap, or click again to choose a skin.`;
              renderCycle();
          }
        });
        cycleElement.appendChild(button);
      });
    }

    renderCycle();
  </script>
</body>
</html>
