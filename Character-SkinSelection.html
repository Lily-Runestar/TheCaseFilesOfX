<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character and Skin Selection</title>
  <style>
    html,body{height:100%;margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    main{height:100%;display:grid;grid-template-rows:auto 1fr 150px}
    header{padding:12px;text-align:center}.back{position:absolute;left:16px;top:16px}
    #skins{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:18px;padding:20px}
    #characters{display:flex;justify-content:center;gap:8px;padding-top:8px}
    #characters button{min-width:48px;padding:10px;color:#fff;background:#292929;border:1px solid #777;cursor:pointer}
    #characters button.locked{opacity:.45}
    #characters button img,#cycle button img{width:34px;height:34px;object-fit:contain}
    .skin{width:150px;height:180px;background:#292929;border:2px solid #777;color:#fff}
    .skin img{width:110px;height:110px;object-fit:contain}
    #cycle{display:flex;justify-content:center;gap:10px;background:#181818;border-top:2px solid #777;padding:20px}
    #cycle button{width:95px;height:95px;background:#292929;border:2px solid #777;color:#fff;font-size:24px}
    #cycle button.exchange{border-color:#ffd700}
    #cycle button.selected-slot{border-color:#4db8ff;box-shadow:0 0 12px rgba(77,184,255,.65)}
    a.back{color:#fff;background:#292929;border:1px solid #777;padding:10px;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <header><a class="back" href="index.html">BACK</a><h1>CHARACTERS / SKINS</h1><div id="characters"></div><p id="status"></p></header>
    <div id="skins"></div>
    <div id="cycle" aria-label="Number cycle"></div>
  </main>
  <script src="player controls/player-controls.js?v=lny2024-2"></script>
  <script>
    const status = document.getElementById("status");
    const skinsElement = document.getElementById("skins");
    const cycleElement = document.getElementById("cycle");
    let settings = loadPlayerSettings();
    let selectedNumber = null;
    let selectedCycleSlot = null;
    let progress;
    try {
      progress = JSON.parse(localStorage.getItem("sixtySevenProgress") || "{}");
    } catch (error) {
      progress = {};
    }
    progress.characters = progress.characters || {};
    progress.characters["1"] = "UNLOCKED";

    function isCharacterUnlocked(number) {
      return number === 1 || progress.characters[String(number)] === "UNLOCKED";
    }

    function addCharacterIcon(button, number) {
      if (number !== -1) {
        button.textContent = number;
        return;
      }
      const icon = document.createElement("img");
      icon.src = "Media/Images/-1.png";
      icon.alt = "-1";
      button.appendChild(icon);
    }

    function renderCharacters() {
      const charactersElement = document.getElementById("characters");
      charactersElement.innerHTML = "";
      [-1, 1, 2, 3, 4, 5].forEach((number) => {
        const button = document.createElement("button");
        addCharacterIcon(button, number);
        button.classList.toggle("locked", !isCharacterUnlocked(number));
        button.addEventListener("click", () => {
          if (!isCharacterUnlocked(number)) {
            status.textContent = `${number === -1 ? "-1" : "Number " + number} is locked.`;
            return;
          }
          if (selectedCycleSlot === null) {
            showSkins(number);
          } else {
            settings.cycle[selectedCycleSlot] = number;
            savePlayerSettings(settings);
            status.textContent = `${number === -1 ? "-1" : "Number " + number} replaced cycle slot ${selectedCycleSlot + 1}.`;
            selectedCycleSlot = null;
            renderCycle();
            showSkins(number);
          }
        });
        charactersElement.appendChild(button);
      });
    }

    async function skinFolders(number) {
      const knownFolders = {
          "-1": ["Standard"],
        "1": ["Standard", "Christmas"],
          "2": ["Standard"],
          "3": ["Standard", "LNY2024"],
          "4": ["Standard", "Halloween"],
          "5": ["Standard"]
      };
      return knownFolders[String(number)] || ["Standard"];
    }

    async function showSkins(number) {
      selectedNumber = number;
      skinsElement.innerHTML = "";
      status.textContent = `Choose a skin for ${number === -1 ? "-1" : "Number " + number}`;
      (await skinFolders(number)).forEach((folder) => {
        const button = document.createElement("button");
        button.className = "skin";
        button.innerHTML = `<img alt=""><div>${folder}</div>`;
        const preview = button.querySelector("img");
        preview.src = `Media/Player/${number}/${folder}/${number}_Still.png`;
        preview.onerror = () => { preview.style.display = "none"; };
        button.addEventListener("click", () => {
          settings.skins[String(number)] = folder;
          savePlayerSettings(settings);
          status.textContent = `${number === -1 ? "-1" : "Number " + number}: ${folder}`;
          showSkins(number);
        });
        skinsElement.appendChild(button);
      });
    }

    function renderCycle() {
      cycleElement.innerHTML = "";
      const displayedCycle = [...settings.cycle];
      while (displayedCycle.length < 5) displayedCycle.push([1, 2, 3, 4, 5][displayedCycle.length]);
      displayedCycle.slice(0, 5).forEach((number, index) => {
        const button = document.createElement("button");
        addCharacterIcon(button, number);
        button.classList.toggle("selected-slot", selectedCycleSlot === index);
        button.addEventListener("click", () => {
          if (selectedCycleSlot === index) {
            selectedCycleSlot = null;
            status.textContent = `Choose a skin for ${number === -1 ? "-1" : "Number " + number}.`;
            renderCycle();
            renderCharacters();
            showSkins(number);
            return;
          }
          selectedCycleSlot = index;
          status.textContent = `Cycle slot ${index + 1} selected. Choose a character above or click this slot again for its skin.`;
          renderCycle();
        });
        cycleElement.appendChild(button);
      });
    }

    renderCycle();
    renderCharacters();
  </script>
</body>
</html>
