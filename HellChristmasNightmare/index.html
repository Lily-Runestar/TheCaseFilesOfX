<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELL CHRISTMAS NIGHTMARE</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070707;color:#fff;font-family:Arial,sans-serif}
    #game{position:relative;width:min(1280px,100vw);height:min(720px,100vh);overflow:hidden;background:#17191b url("../Case67/Chapter_7/Media/Chapter7_Background.png") center/cover;margin:auto}
    #ground{position:absolute;left:0;right:0;bottom:0;height:78px;background:#101010;border-top:4px solid #68716b}
    #player,#boss,#meteor{position:absolute;bottom:78px;width:auto;height:auto;image-rendering:pixelated;user-select:none;pointer-events:none;transform-origin:center bottom}
    #player{z-index:4;transform:translateX(-50%) scale(.56)}#boss{z-index:3;max-height:none}#meteor{z-index:5}
    #hud{position:absolute;z-index:10;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:24px;text-shadow:2px 2px #000}
    #health{display:flex;gap:5px}.heart{width:30px;height:30px;object-fit:contain}
    #message{position:absolute;z-index:12;inset:45% 0 auto;text-align:center;font-size:26px;text-shadow:2px 2px #000}
  </style>
</head>
<body>
  <main id="game">
    <div id="ground"></div>
    <img id="player" alt="Player">
    <img id="boss" src="../Media/Enemy/NicholasRenegade/DEMON.png" alt="Demonic Nicholas Renegade">
    <img id="meteor" src="../Media/Enemy/NicholasRenegade/Meteor.png" alt="Meteor" hidden>
    <div id="hud"><div id="health"></div></div>
    <div id="message" aria-live="polite"></div>
  </main>
  <script src="../player controls/player-controls.js"></script>
  <script>
    const game=document.getElementById("game"),player=document.getElementById("player"),boss=document.getElementById("boss"),meteor=document.getElementById("meteor"),health=document.getElementById("health"),message=document.getElementById("message");
    const asset="../Media/Enemy/NicholasRenegade/",keys={left:false,right:false},keyBindings=loadPlayerBindings();
    let unlockedNumbers=[1],number=1,playerX=120,playerY=0,playerVelocityY=0,playerGrounded=true,playerAttacking=false,attackCooldown=0,damageCooldown=0;
    let bossX=game.clientWidth-140,bossHealth=200,playerHealth=getStartingHealth(),facing=1,last=performance.now(),phase="DELAY",phaseTimer=1.5,attack="",finished=false;
    function loadCharacters(){const unlocked=[1];try{const progress=JSON.parse(localStorage.getItem("sixtySevenProgress")||"{}");for(const [character,status] of Object.entries(progress.characters||{}))if(status=== "UNLOCKED")unlocked.push(Number(character))}catch(error){console.warn("Saved characters could not be read.",error)}unlockedNumbers=getSelectedPlayableNumbers(unlocked);if(!unlockedNumbers.includes(number))number=unlockedNumbers[0]||1}
    function setNumber(character){if(!unlockedNumbers.includes(character))return;number=character;draw()}
    function drawHealth(){health.replaceChildren();for(let i=0;i<getStartingHealth();i++){const heart=document.createElement("img");heart.className="heart";heart.src="../Media/Images/Heart.png";heart.alt=i<playerHealth?"Heart":"Empty heart";heart.style.opacity=i<playerHealth?"1":".2";health.appendChild(heart)}}
    function playerFrame(){if(number===-1)return keys.left||keys.right?"Walk":"Still";if(number===3)return !playerGrounded?(playerVelocityY>0?"Jump":"Fall"):keys.left||keys.right?"Walk":"Still";if(number===4)return !playerGrounded?(playerVelocityY>0?"Jump":"Sweep"):playerAttacking?"Sweep":keys.left||keys.right?"WalkF1":"Still";if(number===5)return keys.left||keys.right?"Walk":playerAttacking?"StillAlt":"Still";return !playerGrounded?(playerVelocityY>0?"Jump":"Fall"):playerAttacking?"SwingF1":keys.left||keys.right?"WalkF1":"Still"}
    function draw(){player.src=playerSpritePath(number,playerFrame());player.style.left=`${playerX}px`;player.style.bottom=`${78+playerY}px`;player.style.transform=`translateX(-50%) scale(.56) scaleX(${-facing})`;boss.style.left=`${bossX}px`;boss.style.transform=`translateX(-50%) scaleX(${bossX<playerX?-1:1})`}
    function damagePlayer(){if(finished||damageCooldown>0)return;damageCooldown=.7;playerHealth--;drawHealth();if(playerHealth<=0){finished=true;message.textContent="DEFEATED"}}
    function unlockCharacter16(){try{const progress=JSON.parse(localStorage.getItem("sixtySevenProgress")||"{}");progress.characters=progress.characters||{};progress.characters["16"]="UNLOCKED";localStorage.setItem("sixtySevenProgress",JSON.stringify(progress))}catch(error){console.error("Could not unlock Character 16",error)}}
    function victory(){finished=true;unlockCharacter16();message.textContent="VICTORY — 16 UNLOCKED"}
    function beginAttack(){boss.src=asset+(attack==="PRESENT"?"Present.png":"DEMON.png");meteor.hidden=attack!=="METEOR";meteor.style.transform="translateX(-50%)";if(attack==="PRESENT")boss.style.transform="translateX(-50%) scale(.1) scaleX(1)";if(attack==="METEOR"){meteor.style.left=`${playerX}px`;meteor.style.bottom="520px"}}
    function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!finished){const movement=(keys.right?1:0)-(keys.left?1:0);playerX+=movement*300*dt;if(movement)facing=movement;playerX=Math.max(22,Math.min(game.clientWidth-22,playerX));phaseTimer-=dt;damageCooldown=Math.max(0,damageCooldown-dt);attackCooldown=Math.max(0,attackCooldown-dt);if(!playerGrounded){playerVelocityY-=1900*dt;playerY+=playerVelocityY*dt;if(playerY<=0){playerY=0;playerVelocityY=0;playerGrounded=true}}if(phase=== "DELAY"&&phaseTimer<=0){phase="STILL";phaseTimer=5}else if(phase=== "STILL"&&phaseTimer<=0){attack=Math.random()<.5?"PRESENT":"METEOR";boss.src=asset+"DEMON.png";phase="READY";phaseTimer=1}else if(phase=== "READY"&&phaseTimer<=0){phase="ATTACK";phaseTimer=2;beginAttack()}else if(phase=== "ATTACK"&&phaseTimer<=0){meteor.hidden=true;attack="";boss.src=asset+"DEMON.png";boss.style.transform=`translateX(-50%) scaleX(${bossX<playerX?-1:1})`;phase="STILL";phaseTimer=5}if(phase=== "ATTACK"&&attack==="METEOR"){meteor.style.bottom=`${Math.max(78,parseFloat(meteor.style.bottom)-260*dt)}px`;if(parseFloat(meteor.style.bottom)<=78){meteor.hidden=true;if(Math.abs(parseFloat(meteor.style.left)-playerX)<70)damagePlayer()}}draw();requestAnimationFrame(loop)}}
    addEventListener("keydown",e=>{const key=e.key.toLowerCase();if(key===keyBindings.left||key=== "arrowleft")keys.left=true;if(key===keyBindings.right||key=== "arrowright")keys.right=true;if((key===keyBindings.jump||key=== "arrowup")&&!e.repeat&&playerGrounded){playerVelocityY=798;playerGrounded=false}if(key===keyBindings.previous&&!e.repeat){const index=unlockedNumbers.indexOf(number);setNumber(unlockedNumbers[(index-1+unlockedNumbers.length)%unlockedNumbers.length])}if(key===keyBindings.next&&!e.repeat){const index=unlockedNumbers.indexOf(number);setNumber(unlockedNumbers[(index+1)%unlockedNumbers.length])}if(key===keyBindings.attack&&!e.repeat&&attackCooldown<=0){attackCooldown=.36;playerAttacking=true;if(Math.abs(playerX-bossX)<110){bossHealth=Math.max(0,bossHealth-1);if(bossHealth===0)victory()}setTimeout(()=>playerAttacking=false,180);draw()}});
    addEventListener("keyup",e=>{const key=e.key.toLowerCase();if(key===keyBindings.left||key==="arrowleft")keys.left=false;if(key===keyBindings.right||key==="arrowright")keys.right=false});
    loadCharacters();drawHealth();bossX=game.clientWidth-140;draw();requestAnimationFrame(loop);
  </script>
</body>
</html>
