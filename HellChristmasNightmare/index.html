<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELL CHRISTMAS NIGHTMARE</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070707;color:#fff;font-family:Arial,sans-serif}
    #game{position:relative;width:min(1280px,100vw);height:min(720px,100vh);overflow:hidden;background:#17191b url("../Case67/Chapter_7/Media/Chapter7_Background.png") center/cover;margin:auto}
    #ground{position:absolute;left:0;right:0;bottom:0;height:78px;background:#101010;border-top:4px solid #68716b}
    #player,#boss,#meteor{position:absolute;bottom:78px;height:78px;width:auto;image-rendering:pixelated;user-select:none;pointer-events:none;transform-origin:center bottom}
    #player{z-index:4}#boss{z-index:3}#meteor{z-index:5;height:54px}
    #hud{position:absolute;z-index:10;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:24px;text-shadow:2px 2px #000}
    #health{display:flex;gap:5px}.heart{width:30px;height:30px;object-fit:contain}
    #message{position:absolute;z-index:12;inset:45% 0 auto;text-align:center;font-size:26px;text-shadow:2px 2px #000}
  </style>
</head>
<body>
  <main id="game">
    <div id="ground"></div>
    <img id="player" alt="Player">
    <img id="boss" src="../Media/Enemy/NicholasRenegade/DEMON.png" alt="Demonic Nicholas Renegade">
    <img id="meteor" src="../Media/Enemy/NicholasRenegade/Meteor.png" alt="Meteor" hidden>
    <div id="hud"><div id="health"></div><div id="boss-health">BOSS 200 / 200</div></div>
    <div id="message" aria-live="polite"></div>
  </main>
  <script src="../player controls/player-controls.js"></script>
  <script>
    const game=document.getElementById("game"),player=document.getElementById("player"),boss=document.getElementById("boss"),meteor=document.getElementById("meteor"),health=document.getElementById("health"),bossHealthElement=document.getElementById("boss-health"),message=document.getElementById("message");
    const asset="../Media/Enemy/NicholasRenegade/",keys={left:false,right:false};
    let playerX=120,bossX=900,bossHealth=200,playerHealth=getStartingHealth(),facing=1,last=performance.now(),attackTimer=1.4,presentTimer=0,meteorTimer=0,finished=false;
    function drawHealth(){health.replaceChildren();for(let i=0;i<getStartingHealth();i++){const heart=document.createElement("img");heart.className="heart";heart.src="../Media/Images/Heart.png";heart.alt=i<playerHealth?"Heart":"Empty heart";heart.style.opacity=i<playerHealth?"1":".2";health.appendChild(heart)}}
    function draw(){player.src="../Media/Player/1/Standard/1_Still.png";player.style.left=`${playerX}px`;player.style.transform=`translateX(-50%) scaleX(${facing})`;boss.style.left=`${bossX}px`;boss.style.transform=`translateX(-50%) scaleX(${bossX<playerX?-1:1})`;bossHealthElement.textContent=`BOSS ${bossHealth} / 200`}
    function damagePlayer(){if(finished)return;playerHealth--;drawHealth();if(playerHealth<=0){finished=true;message.textContent="DEFEATED"}}
    function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!finished){playerX+=((keys.right?1:0)-(keys.left?1:0))*300*dt;if(keys.left)facing=-1;if(keys.right)facing=1;playerX=Math.max(22,Math.min(game.clientWidth-22,playerX));attackTimer-=dt;presentTimer-=dt;meteorTimer-=dt;if(presentTimer<=0){boss.src=asset+(presentTimer===0&&attackTimer<-.15?"Present.png":"DEMON.png")}if(attackTimer<=0){if(Math.random()<.5){presentTimer=.85;boss.src=asset+"Present.png";attackTimer=2.8}else{meteor.hidden=false;meteor.style.left=`${playerX}px`;meteor.style.bottom="520px";meteorTimer=.55;attackTimer=2.5}}if(!meteor.hidden){meteor.style.bottom=`${Math.max(78,parseFloat(meteor.style.bottom)-620*dt)}px`;if(parseFloat(meteor.style.bottom)<=78){meteor.hidden=true;if(Math.abs(parseFloat(meteor.style.left)-playerX)<55)damagePlayer()}}if(Math.abs(playerX-bossX)<50&&meteorTimer<=0)damagePlayer();draw();requestAnimationFrame(loop)}}
    addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k=== "a"||k=== "arrowleft")keys.left=true;if(k=== "d"||k=== "arrowright")keys.right=true;if(k=== " "&&!e.repeat&&Math.abs(playerX-bossX)<110){bossHealth=Math.max(0,bossHealth-1);if(bossHealth===0){finished=true;message.textContent="VICTORY"}draw()}});
    addEventListener("keyup",e=>{const k=e.key.toLowerCase();if(k=== "a"||k=== "arrowleft")keys.left=false;if(k=== "d"||k=== "arrowright")keys.right=false});
    drawHealth();draw();requestAnimationFrame(loop);
  </script>
</body>
</html>
