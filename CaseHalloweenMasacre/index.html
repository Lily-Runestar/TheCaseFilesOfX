<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASE HALLOWEEN MASSACRE</title>
  <style>
    @font-face{font-family:Heading;src:url("../Media/Fonts/Heading.ttf") format("truetype")}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090909;color:#eee;font-family:Heading,sans-serif}
    body{display:grid;place-items:center}
    #GAME{position:relative;width:min(1280px,100vw);height:min(720px,100vh);overflow:hidden;border:2px solid #000;background:#181818;isolation:isolate}
    #BACKGROUND{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0}
    #TREE{position:absolute;z-index:1;top:0;left:50%;height:100%;width:auto;transform:translateX(-50%);image-rendering:pixelated;pointer-events:none}
    #TREE.hit{animation:tree-damage-flash .42s steps(1,end) 1}
    @keyframes tree-damage-flash{0%,100%{opacity:1}25%,75%{opacity:.25}}
    #GROUND{position:absolute;z-index:2;left:0;right:0;bottom:0;height:90px;border-top:3px solid #57465d;background:#100e12 url("../Media/Images/Floor.png") repeat;background-size:64px 64px}
    .branch{position:absolute;z-index:3;top:-96px;height:320px;width:auto;transform:translateX(-50%) scaleY(-1);transform-origin:50% 50%;image-rendering:pixelated;pointer-events:none}
    .branch.active{z-index:5}
    #BRANCH-WARNING{display:none;position:absolute;z-index:4;width:112px;height:140px;border:2px solid rgba(255,35,35,.28);background:rgba(255,0,0,.09);box-shadow:0 0 16px rgba(255,0,0,.12);transform:translateX(-50%);pointer-events:none}
    #PLAYER{position:absolute;z-index:6;left:0;bottom:90px;width:auto;height:auto;image-rendering:pixelated;transform-origin:center bottom;user-select:none;pointer-events:none}
    #PLAYER-PROJECTILE{position:absolute;z-index:7;width:auto;height:auto;image-rendering:pixelated;transform-origin:center bottom;pointer-events:none}
    #HUD{position:absolute;z-index:10;top:22px;left:22px;display:flex;align-items:center;gap:18px;pointer-events:none}
    #NUMBER-CIRCLE{position:relative;width:82px;height:87px;display:flex;align-items:center;justify-content:center;border:0;padding:0;background:transparent;cursor:pointer;pointer-events:auto}
    #NUMBER-CIRCLE-BACKGROUND{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:invert(1)}
    #NUMBER-IMAGE{position:absolute;z-index:1;image-rendering:pixelated;filter:invert(1)}
    #HEALTH{display:flex;align-items:center;gap:6px}
    .HEART{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}
    #MESSAGE{position:absolute;z-index:12;left:50%;top:43%;transform:translate(-50%,-50%);color:#eee;font:20px Arial,sans-serif;letter-spacing:2px;text-align:center;text-shadow:0 2px #000;pointer-events:none;opacity:0;transition:opacity .2s}
  </style>
</head>
<body>
  <main id="GAME" aria-label="Halloween Massacre boss fight">
    <img id="BACKGROUND" src="Forest.png" alt="Haunted Halloween forest">
    <img id="TREE" src="../Media/Enemy/BloodTree/Tree.png" alt="The Blood Tree">
    <img id="BRANCH-LEFT" class="branch" src="../Media/Enemy/BloodTree/Branch.png" alt="">
    <img id="BRANCH-RIGHT" class="branch" src="../Media/Enemy/BloodTree/Branch.png" alt="">
    <div id="GROUND"></div>
    <div id="BRANCH-WARNING" aria-hidden="true"></div>
    <img id="PLAYER" alt="Player">
    <img id="PLAYER-PROJECTILE" alt="" hidden>
    <div id="MESSAGE" aria-live="polite"></div>
    <div id="HUD">
      <button id="NUMBER-CIRCLE" type="button" aria-label="Switch character">
        <img id="NUMBER-CIRCLE-BACKGROUND" src="../Media/Images/0.png" alt="">
        <img id="NUMBER-IMAGE" src="../Media/Images/1.png" alt="Number 1">
      </button>
      <div id="HEALTH" aria-label="Health"></div>
    </div>
  </main>
  <script src="../player controls/player-controls.js?v=lny2024-2"></script>
  <script>
    const GAME=document.getElementById("GAME"),PLAYER=document.getElementById("PLAYER"),TREE=document.getElementById("TREE");
    const BRANCHES=[document.getElementById("BRANCH-LEFT"),document.getElementById("BRANCH-RIGHT")];
    const WARNING=document.getElementById("BRANCH-WARNING"),PROJECTILE_IMAGE=document.getElementById("PLAYER-PROJECTILE");
    const HEALTH=document.getElementById("HEALTH"),NUMBER_IMAGE=document.getElementById("NUMBER-IMAGE"),MESSAGE=document.getElementById("MESSAGE");
    const KEY_BINDINGS=loadPlayerBindings(),AVAILABLE_NUMBERS=new Set([-1,1,2,3,4,5,16,44]);
    const GROUND_HEIGHT=90,PLAYER_SCALE=PLAYER_PROFILE.scale,BRANCH_HEIGHT=Math.min(320,GAME.clientHeight*.48);
    const BRANCH_WIDTH=BRANCH_HEIGHT*177/1018+18;
    const BRANCH_TRAVEL_TIME=.85,BRANCH_HOVER_TIME=.7,BRANCH_PLUNGE_TIME=.38,BRANCH_RETURN_TIME=.55;
    const CASE_KEY="CaseHalloweenMasacre";
    const keys={left:false,right:false};
    let playableNumbers=[],currentNumber=1,playerX=130,playerY=0,velocityY=0,onGround=true,facing=1;
    let attacking=false,attackCooldown=0,number1Hold=0,damageCooldown=0,hearts=getStartingHealth(),projectile=null;
    let phase="REST",phaseTimer=1.7,phaseElapsed=0,activeBranchIndex=-1,nextBranchIndex=0,targetX=0;
    let branchHit=false,branchHp=100,finished=false,lastTime=performance.now();

    function loadCharacters(){
      playableNumbers=[...new Set(loadPlayerSettings().cycle.filter(number=>AVAILABLE_NUMBERS.has(number)))];
      if(!playableNumbers.includes(1))playableNumbers.unshift(1);
      if(!playableNumbers.length)playableNumbers=[1];
      if(!playableNumbers.includes(currentNumber))currentNumber=playableNumbers[0];
    }

    function setNumber(number){
      if(!playableNumbers.includes(number))return;
      if(number!==currentNumber){
        projectile=null;
        PROJECTILE_IMAGE.hidden=true;
        PROJECTILE_IMAGE.style.display="none";
        attacking=false;
        attackCooldown=0;
        number1Hold=0;
      }
      currentNumber=number;
      NUMBER_IMAGE.src=`../Media/Images/${number}.png`;
      NUMBER_IMAGE.alt=`Number ${number}`;
      const iconScale={"-1":.28,"1":.2933,"2":.32,"3":.26,"4":.26,"5":.30,"16":.30,"44":.30};
      NUMBER_IMAGE.style.transform=`translate(${number===1||number===2?20:0}px,3px) scale(${iconScale[number]})`;
    }

    function cycleCharacter(direction){
      const index=playableNumbers.indexOf(currentNumber);
      setNumber(playableNumbers[(index+direction+playableNumbers.length)%playableNumbers.length]);
    }

    function drawHealth(){
      HEALTH.replaceChildren();
      for(let index=0;index<getStartingHealth();index++){
        const heart=document.createElement("img");
        heart.className="HEART";
        heart.src="../Media/Images/Heart.png";
        heart.alt=index<hearts?"Heart":"Empty heart";
        heart.style.opacity=index<hearts?"1":".2";
        HEALTH.appendChild(heart);
      }
    }

    function playerFrame(){
      const alternate=Math.floor(performance.now()/140)%2;
      const state=!onGround?(velocityY>0?"JUMP":"FALL"):keys.left||keys.right?"WALK":"STILL";
      return getPlayerAnimationFrame(currentNumber,state,attacking,alternate);
    }

    function drawPlayer(){
      const source=playerSpritePath(currentNumber,playerFrame());
      if(!PLAYER.src.endsWith(source))PLAYER.src=source;
      PLAYER.style.left=`${playerX}px`;
      PLAYER.style.bottom=`${GROUND_HEIGHT+playerY}px`;
      const characterFlip=getPlayerHorizontalFlip(currentNumber,facing,onGround,attacking,performance.now());
      const travelRotation=currentNumber===44&&!onGround?(velocityY>0?-90:velocityY<0?90:0):0;
      PLAYER.style.transform=`translateX(-50%) scale(${PLAYER_SCALE}) rotate(${travelRotation}deg) scaleX(${-facing*characterFlip})`;
    }

    function homeX(index){return GAME.clientWidth*(index===0?.27:.73)}

    function placeBranch(element,x,top){
      element.style.left=`${x}px`;
      element.style.top=`${top}px`;
    }

    function activeBranchBounds(){
      if(activeBranchIndex<0)return null;
      const element=BRANCHES[activeBranchIndex];
      return {
        left:parseFloat(element.style.left)-BRANCH_WIDTH/2,
        right:parseFloat(element.style.left)+BRANCH_WIDTH/2,
        top:parseFloat(element.style.top),
        bottom:parseFloat(element.style.top)+BRANCH_HEIGHT
      };
    }

    function pointHitsBranch(point,radius){
      const bounds=activeBranchBounds();
      if(!bounds)return false;
      const dx=Math.max(bounds.left-point.x,0,point.x-bounds.right);
      const dy=Math.max(bounds.top-point.y,0,point.y-bounds.bottom);
      return Math.hypot(dx,dy)<=radius;
    }

    function finishCase(result,saveFailed=false){
      if(finished)return;
      finished=true;
      MESSAGE.textContent=result==="victory"?"THE BLOOD TREE HAS FALLEN":"THE FOREST CLAIMS YOU";
      MESSAGE.style.opacity="1";
      window.setTimeout(()=>{
        const query=new URLSearchParams({result});
        if(saveFailed)query.set("save","failed");
        window.location.href=`Exit.html?${query}`;
      },1000);
    }

    function saveCompletion(){
      try{
        const progress=JSON.parse(localStorage.getItem("sixtySevenProgress")||"{}");
        progress.cases=progress.cases||{};
        progress.cases[CASE_KEY]="COMPLETED";
        localStorage.setItem("sixtySevenProgress",JSON.stringify(progress));
        localStorage.setItem("caseHalloweenMasacreCompleted","true");
        return true;
      }catch(error){
        console.error("Could not save Halloween case completion.",error);
        return false;
      }
    }

    function damageBranch(amount){
      if(activeBranchIndex<0||!["FLOAT","HOVER","PLUNGE"].includes(phase)||branchHp<=0)return;
      branchHp=Math.max(0,branchHp-amount);
      const branch=BRANCHES[activeBranchIndex];
      branch.style.opacity=".35";
      window.setTimeout(()=>{branch.style.opacity="1"},90);
      TREE.classList.remove("hit");
      void TREE.offsetWidth;
      TREE.classList.add("hit");
      if(branchHp===0)finishCase("victory",!saveCompletion());
    }

    function hurtPlayer(){
      if(finished||damageCooldown>0)return;
      damageCooldown=.8;
      hearts--;
      drawHealth();
      if(hearts<=0)finishCase("defeat");
    }

    function showWarning(){
      WARNING.style.left=`${targetX}px`;
      WARNING.style.top=`${GAME.clientHeight-GROUND_HEIGHT-150}px`;
      WARNING.style.display="block";
    }

    function signalAttack(){
      activeBranchIndex=nextBranchIndex;
      nextBranchIndex=1-nextBranchIndex;
      targetX=Math.max(60,Math.min(GAME.clientWidth-60,playerX));
      phase="TELEGRAPH";
      phaseTimer=3;
      branchHit=false;
      TREE.src="../Media/Enemy/BloodTree/TreeAGRO.png";
      showWarning();
    }

    function beginBranchMotion(){
      const branch=BRANCHES[activeBranchIndex];
      branch.src="../Media/Enemy/BloodTree/Branch.png";
      branch.classList.add("active");
      branch.style.height=`${BRANCH_HEIGHT}px`;
      branch.style.opacity="1";
      placeBranch(branch,homeX(activeBranchIndex),-BRANCH_HEIGHT+22);
      WARNING.style.display="none";
      phase="FLOAT";
      phaseElapsed=0;
    }

    function updateEncounter(dt){
      if(phase==="REST"){
        phaseTimer-=dt;
        if(phaseTimer<=0)signalAttack();
        return;
      }
      if(phase==="TELEGRAPH"){
        phaseTimer-=dt;
        if(phaseTimer<=0)beginBranchMotion();
        return;
      }

      const branch=BRANCHES[activeBranchIndex];
      const startX=homeX(activeBranchIndex);
      if(phase==="FLOAT"){
        phaseElapsed+=dt;
        const progress=Math.min(1,phaseElapsed/BRANCH_TRAVEL_TIME);
        const x=startX+(targetX-startX)*progress;
        const top=(-BRANCH_HEIGHT+22)+(68+BRANCH_HEIGHT-22)*progress;
        placeBranch(branch,x,top);
        if(progress>=1){phase="HOVER";phaseTimer=BRANCH_HOVER_TIME}
      }else if(phase==="HOVER"){
        phaseTimer-=dt;
        if(phaseTimer<=0){phase="PLUNGE";phaseElapsed=0}
      }else if(phase==="PLUNGE"){
        phaseElapsed+=dt;
        const progress=Math.min(1,phaseElapsed/BRANCH_PLUNGE_TIME);
        const hoverTop=68;
        const landingTop=GAME.clientHeight-GROUND_HEIGHT-BRANCH_HEIGHT;
        const top=hoverTop+(landingTop-hoverTop)*progress;
        placeBranch(branch,targetX,top);
        if(!branchHit&&branchOverlapsPlayer()){branchHit=true;hurtPlayer()}
        if(progress>=1){phase="RETURN";phaseElapsed=0}
      }else if(phase==="RETURN"){
        phaseElapsed+=dt;
        const progress=Math.min(1,phaseElapsed/BRANCH_RETURN_TIME);
        const landingTop=GAME.clientHeight-GROUND_HEIGHT-BRANCH_HEIGHT;
        const x=targetX+(startX-targetX)*progress;
        const top=landingTop+(-BRANCH_HEIGHT+22-landingTop)*progress;
        placeBranch(branch,x,top);
        if(progress>=1){
          branch.classList.remove("active");
          placeBranch(branch,startX,-96);
          branch.style.height=`${BRANCH_HEIGHT}px`;
          activeBranchIndex=-1;
          TREE.src="../Media/Enemy/BloodTree/Tree.png";
          phase="REST";
          phaseTimer=1.3;
        }
      }
    }

    function branchOverlapsPlayer(){
      const bounds=activeBranchBounds();
      const playerWidth=PLAYER_PROFILE.width*PLAYER_SCALE;
      const playerHeight=PLAYER_PROFILE.height*PLAYER_SCALE;
      const playerBounds={
        left:playerX-playerWidth/2+5,
        right:playerX+playerWidth/2-5,
        top:GAME.clientHeight-(GROUND_HEIGHT+playerY+playerHeight),
        bottom:GAME.clientHeight-(GROUND_HEIGHT+playerY)
      };
      return bounds&&bounds.left<playerBounds.right&&bounds.right>playerBounds.left&&bounds.top<playerBounds.bottom&&bounds.bottom>playerBounds.top;
    }

    function attackWithWeapon(){
      attacking=true;
      attackCooldown=getPlayerActionDuration(currentNumber,"swing");
      if(currentNumber===1)number1Hold=getPlayerActionDuration(1,"swing");
      if(currentNumber===5&&projectile){
        const recalled=getPlayerRecallPosition(currentNumber,projectile,{x:playerX,y:playerY});
        playerX=Math.max(24,Math.min(GAME.clientWidth-24,recalled.x));
        playerY=0;onGround=true;velocityY=0;projectile=null;PROJECTILE_IMAGE.hidden=true;
        attackCooldown=.36;
        return;
      }
      if([3,5,16].includes(currentNumber)){
        projectile=createPlayerProjectile(currentNumber,playerX,GROUND_HEIGHT+playerY,facing);
        PROJECTILE_IMAGE.src=playerSpritePath(currentNumber,currentNumber===3?"Arrow":currentNumber===5?"Alt":"Bomb");
        PROJECTILE_IMAGE.style.left=`${projectile.x}px`;
        PROJECTILE_IMAGE.style.bottom=`${projectile.y}px`;
        PROJECTILE_IMAGE.style.display="block";
      }else{
        if(currentNumber===-1||currentNumber===44)playerX=Math.max(24,Math.min(GAME.clientWidth-24,playerX+facing*180));
        const point={x:playerX+facing*42,y:GAME.clientHeight-(GROUND_HEIGHT+playerY+PLAYER_PROFILE.height*PLAYER_SCALE/2)};
        if(pointHitsBranch(point,100))damageBranch(getPlayerDamage(currentNumber,currentNumber===-1||currentNumber===44?"dash":"space"));
      }
      window.setTimeout(()=>{attacking=false},180);
    }

    function updateProjectile(dt){
      if(!projectile)return;
      const update=updatePlayerProjectileState(projectile,dt,playerX,GAME.clientWidth);
      projectile=update.projectile;
      if(!projectile){PROJECTILE_IMAGE.style.display="none";return}
      PROJECTILE_IMAGE.style.left=`${projectile.x}px`;
      PROJECTILE_IMAGE.style.bottom=`${projectile.y}px`;
      PROJECTILE_IMAGE.style.transform=`translateX(-50%) scale(.75) scaleX(${projectile.direction})`;
      if(currentNumber===16)PROJECTILE_IMAGE.src=playerSpritePath(16,projectile.phase==="exploding"?"Explode":"Bomb");
      if(activeBranchIndex>=0&&["FLOAT","HOVER","PLUNGE"].includes(phase)){
        const point={x:projectile.x,y:GAME.clientHeight-projectile.y};
        if(pointHitsBranch(point,42)&&(projectile.kind!=="bomb"||projectile.phase==="exploding")){
          const action=projectile.kind==="bomb"?"bomb":projectile.kind==="blade"?(projectile.phase==="returning"?"returning":"outbound"):"arrow";
          projectile=null;
          PROJECTILE_IMAGE.style.display="none";
          damageBranch(getPlayerDamage(currentNumber,action));
          return;
        }
      }
      if(update.expired||update.recalled){projectile=null;PROJECTILE_IMAGE.style.display="none"}
    }

    function loop(now){
      const dt=Math.min((now-lastTime)/1000,.04);
      lastTime=now;
      if(finished)return;
      const movement=(keys.right?1:0)-(keys.left?1:0);
      if(canPlayerMove({finished,attackTime:attackCooldown,number1Hold,recallingBlade:currentNumber===5&&projectile?.kind==="blade"})){
        playerX+=movement*PLAYER_PROFILE.speed*dt;
      }
      if(movement)facing=movement;
      playerX=Math.max(24,Math.min(GAME.clientWidth-24,playerX));
      updateEncounter(dt);
      updateProjectile(dt);
      attackCooldown=Math.max(0,attackCooldown-dt);
      number1Hold=Math.max(0,number1Hold-dt);
      damageCooldown=Math.max(0,damageCooldown-dt);
      if(!onGround&&shouldApplyPlayerGravity(currentNumber,attacking)){
        velocityY-=PLAYER_PROFILE.gravity*dt;
        playerY+=velocityY*dt;
        if(playerY<=0){playerY=0;velocityY=0;onGround=true}
      }
      drawPlayer();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown",event=>{
      const key=event.key.toLowerCase();
      if(key===KEY_BINDINGS.left||key==="arrowleft")keys.left=true;
      if(key===KEY_BINDINGS.right||key==="arrowright")keys.right=true;
      if((key===KEY_BINDINGS.jump||key==="arrowup")&&!event.repeat&&onGround&&canPlayerJump(currentNumber)){
        velocityY=getPlayerJumpPower(currentNumber);onGround=false;
      }
      if(key===KEY_BINDINGS.previous&&!event.repeat)cycleCharacter(-1);
      if(key===KEY_BINDINGS.next&&!event.repeat)cycleCharacter(1);
      for(let slot=1;slot<=5;slot++){
        if(key===KEY_BINDINGS[`number${slot}`]&&!event.repeat&&playableNumbers[slot-1]!==undefined)setNumber(playableNumbers[slot-1]);
      }
      if(key===KEY_BINDINGS.attack&&!event.repeat&&attackCooldown<=0)attackWithWeapon();
    });
    window.addEventListener("keyup",event=>{
      const key=event.key.toLowerCase();
      if(key===KEY_BINDINGS.left||key==="arrowleft")keys.left=false;
      if(key===KEY_BINDINGS.right||key==="arrowright")keys.right=false;
    });
    window.addEventListener("blur",()=>{keys.left=keys.right=false});
    document.getElementById("NUMBER-CIRCLE").addEventListener("click",()=>cycleCharacter(1));

    loadCharacters();
    setNumber(currentNumber);
    drawHealth();
    BRANCHES.forEach((branch,index)=>{
      branch.style.height=`${BRANCH_HEIGHT}px`;
      branch.style.left=`${homeX(index)}px`;
    });
    PLAYER.style.left=`${playerX}px`;
    drawPlayer();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
