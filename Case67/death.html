<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SixtySeven — You Died</title>
  <style>
    @font-face {
      font-family: Entity;
      src: url("../Media/Fonts/Entity.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-family: Entity, sans-serif;
    }

    .death-screen {
      animation: death-fade-in 900ms ease-out both;
    }

    @keyframes death-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .death-screen {
        animation: none;
      }
    }

    .death-screen h1 {
      margin: 0;
      font-size: clamp(6rem, 24vw, 16rem);
      letter-spacing: 0.08em;
      text-align: center;
    }

    .death-action {
      position: fixed;
      min-width: 220px;
      padding: 20px 36px;
      border: 0;
      background: transparent;
      color: #fff;
      font: 40px Entity, sans-serif;
      cursor: pointer;
      text-shadow: none;
    }

    #MAIN-MENU {
      right: 24px;
      bottom: 24px;
    }

    #RESTART {
      left: 24px;
      bottom: 24px;
    }

    .death-action:hover,
    .death-action:focus-visible {
      background: transparent;
      outline: none;
      text-shadow: 0 0 8px #fff, 0 0 18px #fff;
    }
  </style>
</head>
<body>
  <main class="death-screen">
    <h1>YOU DIED</h1>
  </main>
  <button id="RESTART" class="death-action" type="button">Restart</button>
  <button id="MAIN-MENU" class="death-action" type="button">Main Menu</button>
  <script>
    function getRestartTarget() {
      if (!document.referrer) return null;
      const previousPage = new URL(document.referrer);
      const chapterMatch = previousPage.pathname.match(/\/Chapter_(\d+)\//i);
      if (!chapterMatch) return null;

      const chapter = chapterMatch[1];
      const startPage = chapter === "7" ? "Chapter7_Enter.html" : `Chapter${chapter}.html`;
      return `Chapter_${chapter}/${startPage}`;
    }

    function restartLevel() {
      const target = getRestartTarget();
      if (!target) {
        console.warn("The chapter to restart could not be determined from the previous page.");
        return;
      }
      window.location.href = target;
    }

    function goToMainMenu() {
      window.location.href = "index.html";
    }

    document.getElementById("RESTART").addEventListener("click", restartLevel);
    document.getElementById("MAIN-MENU").addEventListener("click", goToMainMenu);
  </script>
</body>
</html>
