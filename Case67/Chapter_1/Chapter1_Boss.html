<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIXTYSEVEN — NUMBER 2</title>
  <style>
    @font-face {
      font-family: Heading;
      src: url("../Media/Fonts/Heading.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
      color: #eee;
      font-family: Heading, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #GAME {
      position: relative;
      width: min(1280px, 100vw);
      height: min(720px, 100vh);
      overflow: hidden;
      border: 2px solid #000;
      background: #181818;
      isolation: isolate;
    }

    #ARENA {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #181818 url("Media/Chapter1_Background.png") center center / cover no-repeat;
    }

    #PLAYER-PROJECTILE {
      position: absolute;
      z-index: 4;
      width: auto;
      height: auto;
      image-rendering: pixelated;
      pointer-events: none;
      transform-origin: center;
    }

    #GROUND {
      position: absolute;
      inset: auto 0 0;
      height: 78px;
      border-top: 3px solid #57465d;
      background: #100e12 url("../Media/Images/Floor.png") repeat;
      background-size: 64px 64px;
    }

    .platform {
      position: absolute;
      height: 32px;
      object-fit: fill;
      image-rendering: pixelated;
      pointer-events: none;
    }

    #PLAYER,
    #ENEMY {
      position: absolute;
      bottom: 78px;
      image-rendering: pixelated;
      user-select: none;
      pointer-events: none;
      transform-origin: center bottom;
    }

    #PLAYER {
      z-index: 3;
      width: auto;
      height: auto;
      object-fit: initial;
    }

    #ENEMY {
      z-index: 2;
      width: 100px;
      height: 124px;
      object-fit: contain;
    }

    #HUD {
      position: absolute;
      top: 22px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 10;
      pointer-events: none;
    }

    #NUMBER-CIRCLE {
      position: relative;
      width: 82px;
      height: 87px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #NUMBER-CIRCLE-BACKGROUND {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: invert(1);
    }

    #NUMBER-IMAGE {
      position: absolute;
      z-index: 1;
      image-rendering: pixelated;
      filter: invert(1);
    }

    #HEALTH {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .HEART {
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    #MESSAGE {
      position: absolute;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%);
      color: #eee;
      font: 20px Arial, sans-serif;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 2px #000;
      z-index: 12;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

  </style>
</head>
<body>
  <main id="GAME" aria-label="Fight Number 2">
    <div id="ARENA">
      <div id="GROUND"></div>
      <img id="PLAYER" src="../Media/Player/1/Standard/1_Still.png" alt="Player">
      <img id="ENEMY" src="../Media/Enemy/2/2_Still.png" alt="Number 2">
      <img id="PLAYER-PROJECTILE" alt="" hidden>
    </div>

    <div id="MESSAGE" aria-live="polite"></div>
    <div id="HUD">
      <div id="NUMBER-CIRCLE">
        <img id="NUMBER-CIRCLE-BACKGROUND" src="../Media/Images/0.png" alt="">
        <img id="NUMBER-IMAGE" src="../Media/Images/1.png" alt="Number 1">
      </div>
      <div id="HEALTH" aria-label="Health"></div>
    </div>
  </main>

  <script src="../../player controls/player-controls.js"></script>

  <script>
    const GAME = document.getElementById("GAME");
    const arenaElement = document.getElementById("ARENA");
    const groundElement = document.getElementById("GROUND");
    const playerElement = document.getElementById("PLAYER");
    const enemyElement = document.getElementById("ENEMY");
    const projectileElement = document.getElementById("PLAYER-PROJECTILE");
    const healthElement = document.getElementById("HEALTH");
    const numberImage = document.getElementById("NUMBER-IMAGE");
    const messageElement = document.getElementById("MESSAGE");
    const keys = { left: false, right: false };

    const PLAYER_ANIMATIONS = {
      STILL: ["Still"],
      WALK: ["Still", "WalkF1", "WalkF2", "WalkF1", "WalkF2"],
      JUMP: ["Jump"],
      FALL: ["Fall"],
      SWING: ["Still", "SwingF1", "SwingF2"]
    };
    const ENEMY_ANIMATIONS = {
      STILL: ["Still"],
      WALK: ["Still", "WalkF1", "WalkF2", "WalkF1", "WalkF2"],
      JUMP: ["Jump"],
      FALL: ["Fall"],
      SWING: ["Still", "SwingF1", "SwingF2"]
    };
    const PLAYER_SPEED = 300;
    const JUMP_POWER = 798.4;
    const NUMBER_4_JUMP_POWER = 1050;
    const GRAVITY = 1900;
    const FLOOR_Y = 0;
    const STAGE_WIDTH = GAME.clientWidth;
    const PLATFORM_HEIGHT = 32;
    const PLAYER_WIDTH = 44;
    const PLAYER_HEIGHT = 78;
    const PLAYER_SCALE = 0.56;
    const PLATFORMS = [
      { x: 0.12, y: 120, width: 0.15 },
      { x: 0.34, y: 220, width: 0.15 },
      { x: 0.58, y: 135, width: 0.16 },
      { x: 0.78, y: 215, width: 0.15 }
    ];
    const arenaPlatforms = [];
    const NUMBER_1_SWING_HOLD = 350;
    const PLAYER_ATTACK_DAMAGE = {
      "-1": { dash: 2 },
      "1": { space: 3 },
      "2": { space: 1 },
      "3": { arrow: 2 },
      "4": { jump: 1, space: 2 },
      "5": { outbound: 1, returning: 3 }
    };
    const PLAYER_MAX_HEALTH = 5;
    const ENEMY_MAX_HEALTH = 10;
    const carriedHealth = Number(new URLSearchParams(window.location.search).get("hp"));

    let unlockedNumbers = [1];
    let currentNumber = 1;
    let playerX = STAGE_WIDTH * 0.15;
    let playerY = FLOOR_Y;
    let playerVelocityY = 0;
    let playerGrounded = true;
    let playerHealth = Number.isInteger(carriedHealth) && carriedHealth > 0
      ? Math.min(carriedHealth, PLAYER_MAX_HEALTH)
      : PLAYER_MAX_HEALTH;
    let enemyX = STAGE_WIDTH * 0.82;
    let enemyY = FLOOR_Y;
    let enemyVelocityY = 0;
    let enemyGrounded = true;
    let enemyHealth = ENEMY_MAX_HEALTH;
    let playerFacing = 1;
    let enemyFacing = -1;
    let playerAnimation = "STILL";
    let enemyAnimation = "STILL";
    let playerFrame = 0;
    let enemyFrame = 0;
    let playerAnimationTime = 0;
    let playerFlip = 1;
    let enemyAnimationTime = 0;
    let playerAttackTime = 0;
    let playerAttackHit = false;
    let playerAttackKind = "melee";
    let playerDashTime = 0;
    let playerDashDirection = 1;
    let playerDashHit = false;
    let playerProjectile = null;
    let enemyAttackCooldown = 0.55;
    let enemyJumpCooldown = 0.8;
    let enemyDodgeCooldown = 0;
    let enemyDodgeTime = 0;
    let enemyAttackTime = 0;
    let enemyAttackHit = false;
    let playerInvulnerable = 0;
    let finished = false;
    let lastTime = performance.now();
    let messageTimer;

    function loadUnlockedNumbers() {
      const unlocked = [1];
      try {
        const savedProgress = JSON.parse(localStorage.getItem("sixtySevenProgress") || "{}");
        for (const [number, status] of Object.entries(savedProgress.characters || {})) {
          if (status === "UNLOCKED") unlocked.push(Number(number));
        }
        if (localStorage.getItem("chapter1Completed") === "true") {
          unlocked.push(2);
        }
      } catch (error) {
        console.warn("Saved completion could not be read from browser storage.", error);
      }
      unlockedNumbers = getSelectedPlayableNumbers(unlocked);
      if (!unlockedNumbers.includes(currentNumber)) currentNumber = 1;
      setPlayerFrame(PLAYER_ANIMATIONS[playerAnimation][playerFrame] || "Still");
      setNumber(currentNumber);
    }

    function playerPath(frame) {
      if (currentNumber === -1) {
        const xFrame = frame === "Charge" ? "Charge" :
          frame === "Walk" ? "Walk" : "Still";
        return playerSpritePath(-1, xFrame);
      }
      const spriteNumber = currentNumber;
      return playerSpritePath(spriteNumber, frame);
    }

    function playerAnimationFrames(name) {
      if (currentNumber === -1) {
        if (name === "WALK") return ["Walk", "Walk"];
        if (name === "SWING") return ["Charge"];
        return ["Still"];
      }
      if (currentNumber === 3) {
        if (name === "WALK") return ["Walk"];
        if (name === "SWING") return ["Swing", "Release"];
        return ({ STILL: ["Still"], JUMP: ["Jump"], FALL: ["Fall"] })[name] ||
          PLAYER_ANIMATIONS[name];
      }
      if (currentNumber === 4) {
        if (name === "WALK") return ["WalkF1", "WalkF2"];
        if (name === "SWING") {
          return playerAttackKind === "jump"
            ? ["Jump", "Jump"]
            : ["Sweep", "Sweep", "Sweep", "Sweep"];
        }
        if (name === "FALL") return ["Sweep", "Sweep"];
        return ({ STILL: ["Still"], JUMP: ["Jump"] })[name] ||
          PLAYER_ANIMATIONS[name];
      }
      if (currentNumber === 5) {
        const bladeActive = playerProjectile !== null;
        if (name === "WALK") {
          return bladeActive ? ["WalkAlt", "StillAlt"] : ["Walk", "Still"];
        }
        if (name === "SWING") return ["StillAlt", "StillAlt"];
        if (name === "STILL") return [bladeActive ? "StillAlt" : "Still"];
        if (name === "JUMP" || name === "FALL") {
          return [bladeActive ? "StillAlt" : "Still"];
        }
      }
      return PLAYER_ANIMATIONS[name];
    }

    function setPlayerFrame(frame) {
      const src = playerPath(frame);
      if (!playerElement.src.endsWith(src)) playerElement.src = src;
    }

    function setNumber(number) {
      if (!unlockedNumbers.includes(number)) return;
      currentNumber = number;
      playerProjectile = null;
      projectileElement.hidden = true;
      playerAttackTime = 0;
      playerDashTime = 0;
      numberImage.src = `../Media/Images/${number}.png`;
      numberImage.alt = `Number ${number}`;
      numberImage.hidden = false;
      const iconScale = { "-1": 0.28, "1": 0.2933, "2": 0.32, "3": 0.26, "4": 0.26, "5": 0.30 };
      const iconOffset = number === 1 || number === 2 ? 20 : 0;
      numberImage.style.transform =
        `translate(${iconOffset}px, 3px) scale(${iconScale[number]})`;
      setPlayerFrame(playerAnimationFrames(playerAnimation)[playerFrame] || "Still");
    }

    function setPlayerAnimation(name, reset = false) {
      if (playerAnimation !== name || reset) {
        playerAnimation = name;
        playerFrame = 0;
        playerAnimationTime = 0;
        if (currentNumber === 4 && (name === "FALL" || name === "SWING")) {
          playerFlip = 1;
        }
        setPlayerFrame(playerAnimationFrames(name)[0]);
      }
    }

    function setEnemyFrame(frame) {
      const src = `../Media/Enemy/2/2_${frame}.png`;
      if (!enemyElement.src.endsWith(src)) enemyElement.src = src;
    }

    function setEnemyAnimation(name, reset = false) {
      if (enemyAnimation !== name || reset) {
        enemyAnimation = name;
        enemyFrame = 0;
        enemyAnimationTime = 0;
        setEnemyFrame(ENEMY_ANIMATIONS[name][0]);
      }
    }

    function buildPlatforms() {
      groundElement.style.width = "100%";
      for (const layout of PLATFORMS) {
        const platform = {
          x: layout.x * STAGE_WIDTH,
          y: layout.y,
          width: layout.width * STAGE_WIDTH
        };
        arenaPlatforms.push(platform);
        for (let x = platform.x; x < platform.x + platform.width; x += 64) {
          const tile = document.createElement("img");
          tile.className = "platform";
          tile.src = "../Media/Images/Platform.png";
          tile.alt = "";
          tile.draggable = false;
          tile.style.cssText =
            `left:${x}px;bottom:${78 + platform.y - PLATFORM_HEIGHT}px;width:${Math.min(64, platform.x + platform.width - x)}px`;
          tile.addEventListener("error", () => tile.remove(), { once: true });
          arenaElement.insertBefore(tile, playerElement);
        }
      }
    }

    function updateVerticalMovement(x, y, velocityY, grounded, dt) {
      const previousY = y;
      if (!grounded) {
        velocityY -= GRAVITY * dt;
        y += velocityY * dt;
      }

      grounded = false;
      if (velocityY <= 0) {
        const fighterLeft = x - PLAYER_WIDTH / 2 + 7;
        const fighterRight = x + PLAYER_WIDTH / 2 - 7;
        for (const platform of arenaPlatforms) {
          const crossedTop = previousY >= platform.y && y <= platform.y;
          const overlapsPlatform =
            fighterRight > platform.x && fighterLeft < platform.x + platform.width;
          if (crossedTop && overlapsPlatform) {
            y = platform.y;
            velocityY = 0;
            grounded = true;
            break;
          }
        }
      }

      if (!grounded && y <= FLOOR_Y) {
        y = FLOOR_Y;
        velocityY = 0;
        grounded = true;
      }

      return { y, velocityY, grounded };
    }

    function animate(dt, elapsedMs) {
      playerAnimationTime += elapsedMs;
      enemyAnimationTime += elapsedMs;
      const playerFrameDelay =
        playerAnimation === "SWING" && currentNumber === 1 && playerFrame === 2
          ? NUMBER_1_SWING_HOLD
          : currentNumber === -1 && playerAnimation === "SWING"
            ? 240
          : currentNumber === 4 &&
            (playerAnimation === "FALL" ||
              (playerAnimation === "SWING" && playerAttackKind !== "jump"))
            ? 70
          : 140;
      if (playerAnimationTime >= playerFrameDelay) {
        playerAnimationTime -= playerFrameDelay;
        const frames = playerAnimationFrames(playerAnimation);
        if (playerAnimation === "SWING") {
          if (playerFrame < frames.length - 1) {
            playerFrame++;
            if (currentNumber === 4 && playerAttackKind !== "jump") {
              playerFlip *= -1;
            }
            setPlayerFrame(frames[playerFrame]);
          } else {
            playerAttackTime = 0;
            setPlayerAnimation(playerGrounded ? (keys.left || keys.right ? "WALK" : "STILL") : "FALL", true);
          }
        } else if (frames.length > 1) {
          playerFrame = (playerFrame + 1) % frames.length;
          if (currentNumber === 4 && playerAnimation === "FALL") {
            playerFlip *= -1;
          }
          setPlayerFrame(frames[playerFrame]);
        }
      }

      if (enemyAnimationTime >= 140) {
        enemyAnimationTime %= 140;
        const frames = ENEMY_ANIMATIONS[enemyAnimation];
        if (enemyAnimation === "SWING") {
          if (enemyFrame < frames.length - 1) {
            enemyFrame++;
            setEnemyFrame(frames[enemyFrame]);
          } else if (enemyAttackTime >= 0.55) {
            enemyAttackTime = 0;
            setEnemyAnimation("STILL", true);
          }
        } else if (frames.length > 1) {
          enemyFrame = (enemyFrame + 1) % frames.length;
          setEnemyFrame(frames[enemyFrame]);
        }
      }
    }

    function damageEnemy(amount) {
      enemyHealth = Math.max(0, enemyHealth - amount);
      if (enemyHealth <= 0) finishFight(true);
    }

    function attackPlayer(kind = "space") {
      if (finished || playerAttackTime > 0) return;
      if (currentNumber === 5 && playerProjectile) {
        playerX = playerProjectile.x;
        playerY = playerProjectile.y;
        playerVelocityY = 0;
        playerGrounded = false;
        playerProjectile = null;
        projectileElement.hidden = true;
        return;
      }

      playerAttackTime = 0.001;
      playerAttackHit = false;
      playerAttackKind = kind;
      playerFacing = enemyX >= playerX ? 1 : -1;
      setPlayerAnimation("SWING", true);

      if (currentNumber === 3) {
        playerProjectile = {
          kind: "arrow",
          x: playerX + playerFacing * 45,
          y: playerY + 48,
          direction: playerFacing,
          elapsed: 0
        };
        projectileElement.src = "../Media/Player/3/Standard/3_Arrow.png";
        projectileElement.hidden = false;
      } else if (currentNumber === 5) {
        playerProjectile = {
          kind: "blade",
          x: playerX + playerFacing * 42,
          y: playerY + 50,
          direction: playerFacing,
          elapsed: 0,
          phase: "outbound",
          phaseTime: 0,
          outboundHit: false,
          returnHit: false,
          rotation: 0
        };
        projectileElement.src = "../Media/Player/5/Standard/5_Alt.png";
        projectileElement.hidden = false;
      } else if (currentNumber === -1) {
        playerDashTime = 0.24;
        playerDashDirection = playerFacing;
        playerDashHit = false;
        playerInvulnerable = Math.max(playerInvulnerable, 0.5);
      }
    }

    function attackEnemy() {
      if (enemyAnimation === "SWING" || finished) return;
      enemyAttackCooldown = 0.85;
      enemyAttackTime = 0.001;
      enemyAttackHit = false;
      enemyFacing = playerX >= enemyX ? 1 : -1;
      setEnemyAnimation("SWING", true);
    }

    function playerAttackHits() {
      const distance = enemyX - playerX;
      return Math.abs(distance) < 112 &&
        Math.abs(enemyY - playerY) < 88 &&
        Math.sign(distance || playerFacing) === playerFacing;
    }

    function updatePlayerProjectile(dt) {
      if (!playerProjectile) return;

      const projectile = playerProjectile;
      projectile.elapsed += dt;
      projectile.phaseTime += dt;

      if (projectile.kind === "arrow") {
        projectile.x += projectile.direction * 620 * dt;
        if (
          Math.abs(projectile.x - enemyX) < 38 &&
          Math.abs(projectile.y - (enemyY + 52)) < 76
        ) {
          damageEnemy(PLAYER_ATTACK_DAMAGE["3"].arrow);
          playerProjectile = null;
          projectileElement.hidden = true;
          return;
        }
        if (projectile.elapsed >= 1.3 || projectile.x < 0 || projectile.x > STAGE_WIDTH) {
          playerProjectile = null;
          projectileElement.hidden = true;
          return;
        }
      } else if (projectile.phase === "outbound") {
        projectile.x += projectile.direction * 300 * dt;
        if (
          !projectile.outboundHit &&
          Math.abs(projectile.x - enemyX) < 42 &&
          Math.abs(projectile.y - (enemyY + 52)) < 82
        ) {
          projectile.outboundHit = true;
          damageEnemy(PLAYER_ATTACK_DAMAGE["5"].outbound);
        }
        if (projectile.phaseTime >= 3) {
          projectile.phase = "paused";
          projectile.phaseTime = 0;
        }
      } else if (projectile.phase === "paused") {
        if (projectile.phaseTime >= 0.45) {
          projectile.phase = "returning";
          projectile.phaseTime = 0;
        }
      } else {
        const distanceToPlayer = playerX - projectile.x;
        projectile.x += Math.sign(distanceToPlayer) * 480 * dt;
        if (
          !projectile.returnHit &&
          Math.abs(projectile.x - enemyX) < 42 &&
          Math.abs(projectile.y - (enemyY + 52)) < 82
        ) {
          projectile.returnHit = true;
          damageEnemy(PLAYER_ATTACK_DAMAGE["5"].returning);
        }
        if (Math.abs(distanceToPlayer) < 30) {
          playerProjectile = null;
          projectileElement.hidden = true;
          return;
        }
      }

      projectileElement.style.left = `${projectile.x}px`;
      projectileElement.style.bottom = `${78 + projectile.y}px`;
      if (projectile.kind === "blade") {
        projectile.rotation += 540 * dt;
        projectileElement.style.transform =
          `translateX(-50%) scale(0.65) rotate(${projectile.rotation}deg)`;
      } else {
        projectileElement.style.transform =
          `translateX(-50%) scale(1.2) scaleX(${projectile.direction})`;
      }
    }

    function enemyAttackHits() {
      const distance = playerX - enemyX;
      return Math.abs(distance) < 112 &&
        Math.abs(playerY - enemyY) < 88 &&
        Math.sign(distance || enemyFacing) === enemyFacing;
    }

    function updateHealth() {
      healthElement.innerHTML = "";
      for (let index = 0; index < PLAYER_MAX_HEALTH; index++) {
        const heart = document.createElement("img");
        heart.className = "HEART";
        heart.src = "../Media/Images/Heart.png";
        heart.alt = index < playerHealth ? "Heart" : "Empty heart";
        heart.style.opacity = index < playerHealth ? "1" : ".2";
        healthElement.appendChild(heart);
      }
    }

    function showMessage(text) {
      messageElement.textContent = text;
      messageElement.style.opacity = "1";
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        messageElement.style.opacity = "0";
      }, 1300);
    }

    function finishFight(won) {
      finished = true;
      keys.left = false;
      keys.right = false;
      window.location.href = won ? "Chapter1_Exit.html" : "../death.html";
    }

    function draw() {
      playerElement.style.left = `${playerX}px`;
      playerElement.style.bottom = `${78 + playerY}px`;
      const facingFlip = playerFacing === 1 ? -1 : 1;
      const animationFlip =
        currentNumber === 4 &&
        (playerAnimation === "FALL" ||
          (playerAnimation === "SWING" && playerAttackKind !== "jump"))
          ? playerFlip
          : 1;
      playerElement.style.transform =
        `translateX(-50%) scale(${PLAYER_SCALE}) scaleX(${facingFlip * animationFlip})`;
      enemyElement.style.left = `${enemyX}px`;
      enemyElement.style.bottom = `${78 + enemyY}px`;
      enemyElement.style.transform = `translateX(-50%) scaleX(${enemyFacing === 1 ? -1 : 1})`;
    }

    function update(dt, elapsedMs) {
      if (finished) return;

      const move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (playerDashTime > 0) {
        playerDashTime = Math.max(0, playerDashTime - dt);
        playerX += playerDashDirection * 900 * dt;
        if (
          !playerDashHit &&
          Math.abs(enemyX - playerX) < 58 &&
          Math.abs(enemyY - playerY) < 92
        ) {
          playerDashHit = true;
          damageEnemy(PLAYER_ATTACK_DAMAGE["-1"].dash);
        }
      } else if (move !== 0 && playerAttackTime === 0) {
        playerX = Math.max(PLAYER_WIDTH / 2, Math.min(STAGE_WIDTH - PLAYER_WIDTH / 2, playerX + move * PLAYER_SPEED * dt));
        playerFacing = move;
      }

      if (playerAttackTime > 0) {
        playerAttackTime += dt;
        const attackHitTime = playerAttackKind === "jump" ? 0.1 : 0.18;
        if (!playerAttackHit && playerAttackTime >= attackHitTime) {
          playerAttackHit = true;
          const damageByAction = PLAYER_ATTACK_DAMAGE[currentNumber];
          const meleeDamage = damageByAction
            ? damageByAction[playerAttackKind === "jump" ? "jump" : "space"]
            : 0;
          if (
            meleeDamage &&
            playerAttackHits() &&
            currentNumber !== 3 &&
            currentNumber !== 5 &&
            currentNumber !== -1
          ) {
            damageEnemy(meleeDamage);
          }
        }
      }

      const playerPhysics = updateVerticalMovement(
        playerX, playerY, playerVelocityY, playerGrounded, dt
      );
      playerY = playerPhysics.y;
      playerVelocityY = playerPhysics.velocityY;
      playerGrounded = playerPhysics.grounded;

      updatePlayerProjectile(dt);

      if (playerAttackTime === 0) {
        setPlayerAnimation(!playerGrounded ? (playerVelocityY > 0 ? "JUMP" : "FALL") : move ? "WALK" : "STILL");
      }

      enemyJumpCooldown = Math.max(0, enemyJumpCooldown - dt);
      enemyDodgeCooldown = Math.max(0, enemyDodgeCooldown - dt);
      enemyDodgeTime = Math.max(0, enemyDodgeTime - dt);
      const distance = playerX - enemyX;
      const absoluteDistance = Math.abs(distance);
      enemyFacing = distance >= 0 ? 1 : -1;
      if (enemyAnimation !== "SWING") {
        enemyAttackCooldown = Math.max(0, enemyAttackCooldown - dt);
      }
      if (enemyAnimation !== "SWING" && enemyAttackTime === 0) {
        const verticallyClose = Math.abs(playerY - enemyY) < 92;
        const playerIsSwingingAtEnemy =
          playerAttackTime > 0 &&
          absoluteDistance < 190 &&
          playerFacing === Math.sign(distance);

        if (playerIsSwingingAtEnemy && enemyDodgeCooldown === 0) {
          enemyDodgeTime = 0.27;
          enemyDodgeCooldown = 0.42;
        }

        if (enemyDodgeTime > 0 && verticallyClose) {
          const escapeDirection = Math.sign(enemyX - playerX) || -playerFacing;
          const escapeTarget = enemyX + escapeDirection * 92;
          const escapeX = Math.max(50, Math.min(STAGE_WIDTH - 50, escapeTarget));
          const actualEscapeDirection = Math.sign(escapeX - enemyX);
          enemyX += actualEscapeDirection * Math.min(300 * dt, Math.abs(escapeX - enemyX));
          enemyFacing = -escapeDirection;
          setEnemyAnimation(enemyGrounded ? "WALK" :
            (enemyVelocityY > 0 ? "JUMP" : "FALL"));
        } else {
          const playerIsOnLeft = playerX < STAGE_WIDTH / 2;
          const pressureTargetX = Math.max(
            50,
            Math.min(STAGE_WIDTH - 50, playerX + (playerIsOnLeft ? 72 : -72))
          );
          const playerIsAbove = playerY > enemyY + 100;
          const targetX = playerIsAbove ? playerX : pressureTargetX;
          const targetDistance = targetX - enemyX;

          if (Math.abs(targetDistance) > 20 || !verticallyClose) {
            const direction = Math.sign(verticallyClose ? targetDistance : distance);
            enemyX += direction * Math.min(205 * dt, Math.abs(verticallyClose ? targetDistance : distance));
            setEnemyAnimation(enemyGrounded ? (direction ? "WALK" : "STILL") :
              (enemyVelocityY > 0 ? "JUMP" : "FALL"));
          }

          if (
            enemyAnimation !== "SWING" &&
            absoluteDistance <= 112 &&
            verticallyClose &&
            enemyGrounded &&
            enemyAttackCooldown === 0
          ) {
            attackEnemy();
          } else if (enemyAnimation !== "SWING" && Math.abs(targetDistance) <= 20) {
            setEnemyAnimation(enemyGrounded ? "STILL" : (enemyVelocityY > 0 ? "JUMP" : "FALL"));
          }
        }

        if (
          enemyAnimation !== "SWING" &&
          enemyGrounded &&
          enemyDodgeTime <= 0 &&
          ((playerY > enemyY + 100 && absoluteDistance < 320) ||
            (absoluteDistance > 250 && absoluteDistance < 520 && Math.abs(playerY - enemyY) < 80)) &&
          enemyJumpCooldown === 0
        ) {
          enemyVelocityY = JUMP_POWER;
          enemyGrounded = false;
          enemyJumpCooldown = 2.2;
          setEnemyAnimation("JUMP", true);
        }
      }

      const enemyPhysics = updateVerticalMovement(
        enemyX, enemyY, enemyVelocityY, enemyGrounded, dt
      );
      enemyY = enemyPhysics.y;
      enemyVelocityY = enemyPhysics.velocityY;
      enemyGrounded = enemyPhysics.grounded;

      if (enemyAnimation === "SWING") {
        enemyAttackTime += dt;
        if (!enemyAttackHit && enemyAttackTime >= 0.32) {
          enemyAttackHit = true;
          if (enemyAttackHits() && playerInvulnerable <= 0) {
            playerHealth--;
            playerInvulnerable = 0.9;
            playerElement.style.opacity = "0.45";
            updateHealth();
            if (playerHealth <= 0) finishFight(false);
          }
        }
      }

      if (playerInvulnerable > 0) {
        playerInvulnerable -= dt;
        if (playerInvulnerable <= 0) playerElement.style.opacity = "1";
      }

      playerX = Math.max(PLAYER_WIDTH / 2, Math.min(STAGE_WIDTH - PLAYER_WIDTH / 2, playerX));
      enemyX = Math.max(50, Math.min(STAGE_WIDTH - 50, enemyX));
      animate(dt, elapsedMs);
      draw();
    }

    function loadKeyBindings() { return loadPlayerBindings(); }
    const keyBindings = loadKeyBindings();

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowleft", "arrowright", "arrowup", " "].includes(key)) event.preventDefault();
      if (Object.values(keyBindings).includes(key)) event.preventDefault();
      if (finished) return;
      if (key === keyBindings.left || key === "arrowleft") keys.left = true;
      if (key === keyBindings.right || key === "arrowright") keys.right = true;
      if (
        (key === keyBindings.jump || key === "arrowup") &&
        currentNumber !== -1 &&
        !event.repeat &&
        playerGrounded
      ) {
        playerVelocityY = currentNumber === 4 ? NUMBER_4_JUMP_POWER : JUMP_POWER;
        playerGrounded = false;
        if (currentNumber === 4) {
          attackPlayer("jump");
        } else {
          setPlayerAnimation("JUMP", true);
        }
      }
      if (key === keyBindings.attack && !event.repeat) attackPlayer();
      if (key === keyBindings.previous && !event.repeat && unlockedNumbers.length > 1) {
        const index = unlockedNumbers.indexOf(currentNumber);
        setNumber(unlockedNumbers[(index - 1 + unlockedNumbers.length) % unlockedNumbers.length]);
      }
      if (key === keyBindings.next && !event.repeat && unlockedNumbers.length > 1) {
        const index = unlockedNumbers.indexOf(currentNumber);
        setNumber(unlockedNumbers[(index + 1) % unlockedNumbers.length]);
      }
    });

    document.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (key === keyBindings.left || key === "arrowleft") keys.left = false;
      if (key === keyBindings.right || key === "arrowright") keys.right = false;
    });

    window.addEventListener("blur", () => {
      keys.left = false;
      keys.right = false;
    });

    async function start() {
      try {
        await loadUnlockedNumbers();
      } catch (error) {
        console.error(error);
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    function gameLoop(time) {
      const elapsedMs = time - lastTime;
      lastTime = time;
      update(Math.min(elapsedMs / 1000, 0.04), elapsedMs);
      if (!finished) requestAnimationFrame(gameLoop);
    }

    updateHealth();
    buildPlatforms();
    start();
  </script>
</body>
</html>
