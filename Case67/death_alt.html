<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIXTYSEVEN — ALT ENDING</title>

  <style>
    @font-face {
      font-family: Entity;
      src: url("Media/Fonts/Entity.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #121212;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-family: Entity, sans-serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
    }

    /* Character */
    .character {
      position: absolute;
      z-index: 2;
      width: min(30vw, 300px);
      max-height: 85vh;
      object-fit: contain;
      opacity: 0;
      animation: character-appear 1.5s ease forwards;
      animation-delay: 0.7s;
    }

    .eyes {
      position: absolute;
      z-index: 4;
      top: calc(50% - min(11vh, 80px));
      left: 50%;
      display: flex;
      justify-content: space-between;
      width: min(50vw, 520px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .eyes span {
      width: 10px;
      height: 15px;
      border-radius: 50%;
      background: #f2b7ff;
      box-shadow: 0 0 7px 3px #d34cff, 0 0 20px 8px rgba(211, 76, 255, .7);
    }

    /* Tenticles */
    .Tenticle {
      position: absolute;
      z-index: 3;
      width: min(19vw, 190px);
      height: min(75vh, 650px);
      object-fit: contain;
      object-position: bottom center;
      bottom: -100%;
      opacity: 0;
      transform-origin: bottom center;
    }

    .Tenticle.left {
      left: calc(50% - 150px);
      animation: rise-left 1.6s cubic-bezier(.2,.8,.3,1) forwards;
      animation-delay: 2.2s;
    }

    .Tenticle.middle {
      left: calc(50% - 60px);
      height: min(85vh, 740px);
      animation: rise-middle 1.5s cubic-bezier(.2,.8,.3,1) forwards;
      animation-delay: 2.65s;
    }

    .Tenticle.right {
      left: calc(50% + 30px);
      animation: rise-right 1.6s cubic-bezier(.2,.8,.3,1) forwards;
      animation-delay: 2.45s;
    }

    /* Impact */
    .impact {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: #fff;
      opacity: 0;
      animation: impact-flash 0.35s ease-out forwards;
      animation-delay: 3.8s;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 25%,
        rgba(0, 0, 0, .7) 100%
      );
      opacity: 0;
      animation: vignette-appear 2s ease forwards;
      animation-delay: 3.5s;
    }

    /* Main menu */
    #MAIN-MENU {
      position: fixed;
      z-index: 10;
      right: 24px;
      bottom: 24px;
      min-width: 220px;
      padding: 20px 36px;
      border: 0;
      background: transparent;
      color: #fff;
      font: 40px Entity, sans-serif;
      cursor: pointer;
    }

    #MAIN-MENU:hover,
    #MAIN-MENU:focus-visible {
      outline: none;
      text-shadow: 0 0 8px #fff, 0 0 18px #fff;
    }

    @keyframes character-appear {
      from {
        opacity: 0;
        transform: scale(1.08);
        filter: brightness(0);
      }
      to {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1);
      }
    }

    @keyframes rise-left {
      0% {
        bottom: -100%;
        opacity: 0;
        transform: translateX(-30px);
      }
      15% { opacity: 1; }
      75% {
        transform: translateX(8px);
      }
      90% {
        transform: translateX(0);
      }
      100% {
        bottom: -5%;
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes rise-middle {
      0% {
        bottom: -100%;
        opacity: 0;
        transform: translateY(80px) scale(.8);
      }
      15% { opacity: 1; }
      75% {
        transform: translateY(-15px) scale(1.05);
      }
      100% {
        bottom: -5%;
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes rise-right {
      0% {
        bottom: -100%;
        opacity: 0;
        transform: translateX(30px);
      }
      15% { opacity: 1; }
      75% {
        transform: translateX(-8px);
      }
      100% {
        bottom: -5%;
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes impact-flash {
      0% { opacity: 0; }
      15% { opacity: .8; }
      100% { opacity: 0; }
    }

    @keyframes vignette-appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 600px) {
      .character {
        width: 45vw;
      }

      .Tenticle {
        width: 25vw;
      }

      .Tenticle.left {
        left: 18%;
      }

      .Tenticle.middle {
        left: 37%;
      }

      .Tenticle.right {
        left: 54%;
      }

      #MAIN-MENU {
        right: 8px;
        bottom: 8px;
        min-width: auto;
        font-size: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .character,
      .Tenticle,
      .impact,
      .vignette {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <img
      class="character"
      src="Media/Player/5/Standard/5_StillAlt.png"
      alt=""
    >

    <div class="eyes" aria-hidden="true"><span></span><span></span></div>

    <img
      class="Tenticle left"
      src="Chapter_6/Media/Tenticle.png"
      alt=""
    >

    <img
      class="Tenticle middle"
      src="Chapter_6/Media/Tenticle.png"
      alt=""
    >

    <img
      class="Tenticle right"
      src="Chapter_6/Media/Tenticle.png"
      alt=""
    >

    <div class="impact"></div>
    <div class="vignette"></div>
  </main>

  <button id="MAIN-MENU" type="button">Main Menu</button>

  <script>
    document.getElementById("MAIN-MENU").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // Redirect after the Tenticle animation finishes.
    // Adjust this delay if you change the animation timings.
    window.setTimeout(() => {
      window.location.href = "death.html";
    }, 6500);
  </script>
</body>
</html>
