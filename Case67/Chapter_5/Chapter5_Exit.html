<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIXTYSEVEN — CHAPTER 5 COMPLETE</title>
  <style>
    @font-face {
      font-family: Character;
      src: url("../Media/Fonts/Peeps.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-family: Character, sans-serif;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 32px;
      padding: 24px;
      width: min(100%, 960px);
    }

    #CHAPTER-TEXT {
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
      margin: 0;
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.8;
      text-align: left;
      white-space: pre-line;
    }

    #SAVE-STATUS {
      min-height: 1.5em;
      font-size: 18px;
      text-align: center;
    }

    #CONTINUE {
      padding: 16px 28px;
      border: 0;
      background: transparent;
      color: #fff;
      font: 32px Character, sans-serif;
      cursor: pointer;
    }

    .BUTTON-ROW {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #FAST {
      padding: 16px 28px;
      border: 0;
      background: transparent;
      color: #fff;
      font: 32px Character, sans-serif;
      cursor: pointer;
    }

    #CONTINUE:hover,
    #CONTINUE:focus-visible {
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <p id="CHAPTER-TEXT" aria-live="polite"></p>
    <div id="SAVE-STATUS" role="status" aria-live="polite"></div>
    <div class="BUTTON-ROW">
      <button id="CONTINUE" type="button">Continue</button>
      <button id="FAST" type="button" aria-label="Display text 10 times faster">Fast</button>
    </div>
  </main>
  <script>
    const chapterText = document.getElementById("CHAPTER-TEXT");
    const saveStatus = document.getElementById("SAVE-STATUS");
    const PROGRESS_STORAGE_KEY = "sixtySevenProgress";
    const lines = [
      "Number 5 was on his deathbed, and he was glad that someone had come to end this.",
      "Before the end, he told me what he knew about the entity.",
      "6 and 7 released it into the world, and now it is causing the deaths of poor souls.",
      "I must stop them...",
      "          - X"
    ];
    const text = lines.join("\n\n");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let index = 0;
    let typingTimer;
    let isFast = false;

    function typeNextCharacter() {
      if (index >= text.length) return;
      chapterText.textContent += text[index++];
      if (index < text.length) {
        const delay = text[index - 1] === "\n" ? 280 : 45;
        typingTimer = window.setTimeout(typeNextCharacter, delay / (isFast ? 10 : 1));
      }
    }

    document.getElementById("FAST").addEventListener("click", () => {
      isFast = true;
      window.clearTimeout(typingTimer);
      typeNextCharacter();
    });

    if (reducedMotion) {
      chapterText.textContent = text;
    } else {
      typeNextCharacter();
    }

    async function saveProgress() {
      try {
        const progress = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY) || "{}");
        progress.chapters = progress.chapters || {};
        progress.characters = progress.characters || {};
        progress.chapters["5"] = "UNLOCKED";
        progress.chapters["6"] = "UNLOCKED";
        progress.characters["5"] = "UNLOCKED";
        localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(progress));
        saveStatus.textContent = "";
        return true;
      } catch (error) {
        console.error("Could not save Chapter 5 completion in browser storage.", error);
        saveStatus.textContent = "Could not save progress in this browser.";
        return false;
      }
    }

    document.getElementById("CONTINUE").addEventListener("click", async () => {
      if (await saveProgress()) {
        window.location.href = "../index.html";
      }
    });

    saveProgress();
  </script>
</body>
</html>
