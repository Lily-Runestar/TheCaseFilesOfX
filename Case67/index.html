<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SixtySeven</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="menu">
    <h1>SixtySeven</h1>
    <p id="menu-status" class="menu-status" aria-live="polite"></p>

    <section class="chapters" aria-label="Chapters">
      <button class="chapter-button" data-chapter="1" type="button">CHAPTER 1</button>
      <button class="chapter-button" data-chapter="2" type="button">CHAPTER 2</button>
      <button class="chapter-button" data-chapter="3" type="button">CHAPTER 3</button>
      <button class="chapter-button" data-chapter="4" type="button">CHAPTER 4</button>
      <button class="chapter-button" data-chapter="5" type="button">CHAPTER 5</button>
      <button class="chapter-button" data-chapter="6" type="button">CHAPTER 6</button>
      <button class="chapter-button" data-chapter="7" type="button">CHAPTER 7</button>
    </section>
  </main>

  <button id="settings-button" class="settings-button" type="button">CONTROLS</button>

  <button id="book-button" class="book-button" type="button" aria-label="Open book">
    <span aria-hidden="true">!</span>
  </button>

  <div id="book-overlay" class="book-overlay" hidden>
    <section class="book" role="dialog" aria-modal="true" aria-labelledby="book-title">
      <button id="close-book" class="close-book" type="button" aria-label="Close book">×</button>

      <div class="book-page">
        <div class="book-content">
          <h2 id="book-title">CHARACTER</h2>
          <div id="character-list" class="character-list"></div>
        </div>
      </div>

      <div class="book-controls">
        <button id="previous-page" type="button" aria-label="Previous page">‹</button>
        <span id="page-number">1 / 1</span>
        <button id="next-page" type="button" aria-label="Next page">›</button>
      </div>
    </section>
  </div>

  <div id="settings-overlay" class="settings-overlay" hidden>
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <button id="close-settings" class="close-settings" type="button" aria-label="Close settings">×</button>
      <h2 id="settings-title">CONTROLS</h2>
      <div id="key-bindings" class="key-bindings"></div>
      <p id="settings-status" class="settings-status" aria-live="polite"></p>
      <button id="reset-progress" class="reset-progress" type="button">RESET GAME PROGRESS</button>
    </section>
  </div>

  <script src="index.js"></script>
</body>
</html>
