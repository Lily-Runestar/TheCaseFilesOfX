<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASE CHRISTMAS NIGHTMARE</title>
  <style>
    @font-face{font-family:Heading;src:url("../Media/Fonts/Heading.ttf") format("truetype")}
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080808;color:#fff;font-family:Heading,sans-serif}
    #game{position:relative;width:min(1280px,100vw);height:min(720px,100vh);overflow:hidden;background:#17191b;margin:auto}
    #arena-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;image-rendering:pixelated;pointer-events:none;z-index:0}
    #ground{position:absolute;left:0;right:0;bottom:0;height:78px;background:#101010;border-top:4px solid #68716b}
    #player{position:absolute;bottom:78px;width:auto;height:auto;image-rendering:pixelated;user-select:none;pointer-events:none;transform-origin:center bottom;z-index:4;transform:translateX(-50%) scale(.56)}
    #boss{position:absolute;bottom:78px;width:auto;height:auto;max-height:none;image-rendering:pixelated;user-select:none;pointer-events:none;transform-origin:center bottom;z-index:3}
    #hud{position:absolute;z-index:10;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font:24px Arial,sans-serif;text-shadow:2px 2px #000}
    #health{display:flex;gap:5px}.heart{width:30px;height:30px;object-fit:contain}
    #meteor{position:absolute;display:none;width:auto;height:auto;image-rendering:pixelated;z-index:5}
    .attack-image,#PLAYER-PROJECTILE{position:absolute;width:auto;height:auto;image-rendering:pixelated;pointer-events:none;z-index:5;transform-origin:center bottom}
    #PLAYER-PROJECTILE{display:none}
    #message{position:absolute;z-index:12;inset:45% 0 auto;text-align:center;font:26px Arial,sans-serif;text-shadow:2px 2px #000}
  </style>
</head>
<body>
  <main id="game">
    <img id="arena-background" src="Christmas.png" alt="Christmas arena background">
    <div id="ground"></div>
    <img id="player" alt="Player">
    <img id="boss" src="../Media/Enemy/NicholasRenegade/Still.png" alt="Nicholas Renegade">
    <img id="meteor" src="../Media/Enemy/NicholasRenegade/Meteor.png" alt="Meteor">
    <img id="PLAYER-PROJECTILE" alt="">

    <div id="hud"><div id="health"></div></div>
    <div id="message" aria-live="polite"></div>
  </main>
  <script src="../player controls/player-controls.js?v=lny2024-2"></script>
  <script>
    const game=document.getElementById("game"),player=document.getElementById("player"),boss=document.getElementById("boss");
    const meteor=document.getElementById("meteor"),playerProjectile=document.getElementById("PLAYER-PROJECTILE"),health=document.getElementById("health"),message=document.getElementById("message");
    const keys={left:false,right:false},asset="../Media/Enemy/NicholasRenegade/",keyBindings=loadPlayerBindings();
    let unlockedNumbers=[1],number=1,playerX=120,playerY=0,playerVelocityY=0,playerGrounded=true,playerYVelocity=0,playerAttacking=false,attackCooldown=0,damageCooldown=0,number1Hold=0;
    let bossX=game.clientWidth-140,bossHealth=100,playerHealth=getStartingHealth(),facing=1,last=performance.now(),phase="DELAY",phaseTimer=1.5,activeTell="",finished=false;
let projectile=null;
    const tells=["BLUE","RED","YELLOW","PURPLE"];
    for(const file of ["Blue.png","Red.png","Yellow.png","Purple.png","Still.png","Travel.png","Present.png","Sled.png","Meteor.png","Boom.png"]){const image=new Image();image.src=asset+file}
    function christmasPlayerSprite(character,frame){return playerSpritePath(character===16?1:character,frame)}
    for(const character of [-1,1,2,3,4,5,16])for(const frame of ["Still","Walk","WalkF1","WalkF2","WalkAlt","StillAlt","Jump","Fall","SwingF1","SwingF2","Swing","Release","Sweep","Charge"]){const image=new Image();image.src=christmasPlayerSprite(character,frame)}
    function loadCharacters(){const unlocked=[1];try{const progress=JSON.parse(localStorage.getItem("sixtySevenProgress")||"{}");for(const [character,status] of Object.entries(progress.characters||{}))if(status=== "UNLOCKED")unlocked.push(Number(character))}catch(error){console.warn("Saved characters could not be read.",error)}unlockedNumbers=getSelectedPlayableNumbers(unlocked);if(!unlockedNumbers.includes(number))number=unlockedNumbers[0]||1}
    function setNumber(character){if(!unlockedNumbers.includes(character))return;number=character;draw()}
    function drawHealth(){health.replaceChildren();for(let i=0;i<getStartingHealth();i++){const heart=document.createElement("img");heart.className="heart";heart.src="../Media/Images/Heart.png";heart.alt=i<playerHealth?"Heart":"Empty heart";heart.style.opacity=i<playerHealth?"1":".2";health.appendChild(heart)}}
    function playerFrame(){
      const alternate=Math.floor(performance.now()/140)%2;
      if(number===1&&number1Hold>0)return "SwingF2";
      const state=!playerGrounded?(playerVelocityY>0?"JUMP":"FALL"):keys.left||keys.right?"WALK":"STILL";
      if(!playerAttacking&&state!=="STILL")return getPlayerAnimationFrame(number,state,false,alternate);
      if(number===-1)return playerAttacking?"Charge":keys.left||keys.right?"Walk":"Still";
      if(number===3)return playerAttacking?(alternate?"Release":"Swing"):!playerGrounded?(playerVelocityY>0?"Jump":"Fall"):keys.left||keys.right?"Walk":"Still";
      if(number===4)return playerAttacking?"Sweep":!playerGrounded?(playerVelocityY>0?"Jump":"Sweep"):keys.left||keys.right?(alternate?"WalkF2":"WalkF1"):"Still";
      if(number===5)return !playerGrounded?"Still":playerAttacking?"StillAlt":keys.left||keys.right?(alternate?"WalkAlt":"Walk"):(alternate?"StillAlt":"Still");
      return playerAttacking?getPlayerAnimationFrame(number,"ATTACK",true,alternate):getPlayerAnimationFrame(number,"STILL",false,alternate);
    }
    function draw(){player.src=christmasPlayerSprite(number,playerFrame());player.style.left=`${playerX}px`;player.style.bottom=`${78+playerY}px`;const characterMirror=getPlayerHorizontalFlip(number,facing,playerGrounded,playerAttacking,performance.now());player.style.transform=`translateX(-50%) scale(.56) scaleX(${-facing*characterMirror})`; boss.style.left=`${bossX}px`;boss.style.transform=`translateX(-50%) scaleX(${bossX>game.clientWidth/2?-1:1})`}
    function flashBoss(){let flashes=0;const pulse=()=>{if(flashes>=6){boss.style.opacity="1";return}boss.style.opacity=flashes++%2?"1":"0.25";window.setTimeout(pulse,90)};pulse()}
    function hurtPlayer(){if(finished||damageCooldown>0)return;damageCooldown=.7;playerHealth--;drawHealth();if(playerHealth<=0){finished=true;message.textContent="DEFEATED"}}
    function unlockCharacter16(){try{const progress=JSON.parse(localStorage.getItem("sixtySevenProgress")||"{}");progress.characters=progress.characters||{};progress.characters["16"]="UNLOCKED";progress.cases=progress.cases||{};progress.cases.CaseChristmasNightmare="COMPLETED";localStorage.setItem("sixtySevenProgress",JSON.stringify(progress));localStorage.setItem("caseChristmasNightmareCompleted","true")}catch(error){console.error("Could not unlock Character 16",error)}}
    function victory(){finished=true;unlockCharacter16();message.textContent="VICTORY — 16 UNLOCKED"}
    let attackObjects=[];
    function clearAttackObjects(){for(const object of attackObjects)object.remove();attackObjects=[];meteor.style.display="none"}
    function createAttackImage(file){const image=document.createElement("img");image.className="attack-image";image.src=asset+file;game.appendChild(image);attackObjects.push(image);return image}
    function beginAttack(){
      clearAttackObjects();boss.src=asset+({BLUE:"Still.png",RED:"Red.png",YELLOW:"Yellow.png",PURPLE:"Travel.png"}[activeTell]);
      if(activeTell==="YELLOW"){
        const sled=createAttackImage("Sled.png");sled.x=bossX;sled.direction=playerX<bossX?-1:1;sled.style.left=`${bossX}px`;sled.style.bottom="78px";sled.style.transform=`translateX(-50%) scale(.5) scaleX(${sled.direction===1?-1:1})`;
      }else if(activeTell==="BLUE"){
        for(let index=0;index<2;index++){
          const present=createAttackImage("Present.png");present.x=bossX+(index===0?-35:35);present.elapsed=0;present.targetX=Math.max(120,Math.min(game.clientWidth-120,playerX+(index===0?-180:180)));present.startY=330;present.startX=present.x;present.style.left=`${present.x}px`;present.style.bottom=`${present.startY}px`;present.style.transform="translateX(-50%) scale(.1)";
        }
      }else if(activeTell==="RED"){
        meteor.style.display="block";meteor.style.left=`${playerX}px`;meteor.style.bottom="520px";meteor.style.transform="translateX(-50%) scale(.75)";
      }else if(activeTell==="PURPLE"){
        bossX=bossX<game.clientWidth/2?game.clientWidth-140:140;
      }
    }
    function endAttack(){clearAttackObjects();activeTell="";boss.src=asset+"Still.png";phase="STILL";phaseTimer=5}
    function loop(now){
      const dt=Math.min((now-last)/1000,.04);last=now;
      if(!finished){
        const movement=(keys.right?1:0)-(keys.left?1:0);if(canPlayerMove({finished,attackTime:attackCooldown,number1Hold,recallingBlade:number===5&&projectile?.kind=== "blade"}))playerX+=movement*PLAYER_PROFILE.speed*dt;if(movement)facing=movement;
        playerX=Math.max(22,Math.min(game.clientWidth-22,playerX));phaseTimer-=dt;
        if(phase=== "DELAY"&&phaseTimer<=0){phase="STILL";phaseTimer=5}
        else if(phase=== "STILL"&&phaseTimer<=0){activeTell=tells[Math.floor(Math.random()*tells.length)];boss.src=asset+({BLUE:"Blue.png",RED:"Red.png",YELLOW:"Yellow.png",PURPLE:"Purple.png"}[activeTell]);phase="READY";phaseTimer=1}
        else if(phase=== "READY"&&phaseTimer<=0){beginAttack();phase="ATTACK";phaseTimer=2}
        else if(phase=== "ATTACK"&&phaseTimer<=0)endAttack();
        if(phase=== "ATTACK"){
          if(activeTell==="YELLOW"){
            const sled=attackObjects[0];sled.x=(sled.x||bossX)+sled.direction*320*dt;sled.style.left=`${sled.x}px`;
            if(Math.abs(sled.x-playerX)<120)hurtPlayer();
          }else if(activeTell==="BLUE"){
            for(const present of attackObjects){present.elapsed+=dt;const progress=Math.min(1,present.elapsed/1.5);const x=present.startX+(present.targetX-present.startX)*progress;const height=78+(present.startY-78)*Math.sin(progress*Math.PI)+(present.startY-78)*(1-progress);present.style.left=`${x}px`;present.style.bottom=`${height}px`;
              if(progress>=1){present.src=asset+"Boom.png";present.style.bottom="78px";present.style.transform="translateX(-50%) scale(.45)";if(Math.abs(x-playerX)<90)hurtPlayer();}
            }
          }else if(activeTell==="RED"){
            meteor.style.bottom=`${Math.max(78,parseFloat(meteor.style.bottom)-520*dt)}px`;
            if(parseFloat(meteor.style.bottom)<=78){meteor.style.bottom="78px";meteor.src=asset+"Boom.png";meteor.style.transform="translateX(-50%) scale(.75)";if(Math.abs(parseFloat(meteor.style.left)-playerX)<110)hurtPlayer();window.setTimeout(()=>{meteor.src=asset+"Meteor.png";meteor.style.display="none"},350)}
          }
        }
        updateWeapon(dt);playerYVelocity=playerVelocityY;damageCooldown=Math.max(0,damageCooldown-dt);attackCooldown=Math.max(0,attackCooldown-dt);number1Hold=Math.max(0,number1Hold-dt);
        if(!playerGrounded){playerVelocityY-=1900*dt;playerY+=playerVelocityY*dt;if(playerY<=0){playerY=0;playerVelocityY=0;playerGrounded=true}}
        draw();requestAnimationFrame(loop);
      }}
    function attackWithWeapon(){
      playerAttacking=true;
      attackCooldown=getPlayerActionDuration(number,"swing");
      if(number===1){number1Hold=getPlayerActionDuration(1,"swing")}
      if(number===5&&projectile){const recalled=getPlayerRecallPosition(number,projectile,{x:playerX,y:playerY});playerX=recalled.x;playerY=0;playerGrounded=true;projectile=null;playerProjectile.style.display="none";attackCooldown=.36;return}
      if(number===3){projectile=createPlayerProjectile(number,playerX,78+playerY,facing);playerProjectile.src=playerSpritePath(3,"Arrow");playerProjectile.style.bottom=`${projectile.y}px`;playerProjectile.style.left=`${projectile.x}px`;playerProjectile.style.display="block";playerProjectile.style.transform=`translateX(-50%) scaleX(${facing})`}
      else if(number===5){projectile=createPlayerProjectile(number,playerX,78+playerY,facing);playerProjectile.src=playerSpritePath(5,"Alt");playerProjectile.style.bottom=`${projectile.y}px`;playerProjectile.style.left=`${projectile.x}px`;playerProjectile.style.display="block";playerProjectile.style.transform=`translateX(-50%) scale(.65) scaleX(${facing})`}
      else if(number===-1){playerX=Math.max(22,Math.min(game.clientWidth-22,playerX+facing*180))}
      if(Math.abs(playerX-bossX)<110&&bossHealth>0){bossHealth=Math.max(0,bossHealth-getPlayerDamage(number));attackCooldown=number===1?0.9:attackCooldown;if(number===1){number1Hold=getPlayerActionDuration(1,"hit");attackCooldown=number1Hold}flashBoss();if(bossHealth===0)victory()}
      setTimeout(()=>playerAttacking=false,180);
    }
    function updateWeapon(dt){
      if(!projectile)return;
      const projectileUpdate=updatePlayerProjectileState(projectile,dt,playerX,game.clientWidth);projectile=projectileUpdate.projectile;
      if(!projectile){playerProjectile.style.display="none";return}
      playerProjectile.style.left=`${projectile.x}px`;playerProjectile.style.transform=`translateX(-50%) scale(${projectile.kind=== "blade"?".65":".75"}) scaleX(${projectile.direction})`;
      if(Math.abs(projectile.x-bossX)<55&&bossHealth>0&&((projectile.kind=== "blade"&&projectile.phase=== "returning")?!projectile.returnHit:!projectile.outboundHit)){const action=projectile.kind=== "blade"?(projectile.phase=== "returning"?"returning":"outbound"):"arrow";if(projectile.phase=== "returning")projectile.returnHit=true;else projectile.outboundHit=true;bossHealth=Math.max(0,bossHealth-getPlayerDamage(number,action));flashBoss();if(bossHealth===0)victory();projectile=null;playerProjectile.style.display="none"}
      if(projectileUpdate.expired||projectileUpdate.recalled){projectile=null;playerProjectile.style.display="none"}
    }
    addEventListener("keydown",e=>{const key=e.key.toLowerCase();if(key===keyBindings.left||key=== "arrowleft")keys.left=true;if(key===keyBindings.right||key=== "arrowright")keys.right=true;if((key===keyBindings.jump||key=== "arrowup")&&!e.repeat&&playerGrounded){playerVelocityY=798;playerGrounded=false}if(key===keyBindings.previous&&!e.repeat){const index=unlockedNumbers.indexOf(number);setNumber(unlockedNumbers[(index-1+unlockedNumbers.length)%unlockedNumbers.length])}if(key===keyBindings.next&&!e.repeat){const index=unlockedNumbers.indexOf(number);setNumber(unlockedNumbers[(index+1)%unlockedNumbers.length])}if(key===keyBindings.attack&&!e.repeat&&attackCooldown<=0)attackWithWeapon()});
    addEventListener("keyup",e=>{const key=e.key.toLowerCase();if(key===keyBindings.left||key==="arrowleft")keys.left=false;if(key===keyBindings.right||key==="arrowright")keys.right=false});
    loadCharacters();drawHealth();bossX=game.clientWidth-140;draw();requestAnimationFrame(loop);
  </script>
</body>
</html>
