<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASE CHRISTMAS NIGHTMARE</title>
  <style>
    @font-face{font-family:Heading;src:url("../Media/Fonts/Heading.ttf") format("truetype")}
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080808;color:#fff;font-family:Heading,sans-serif}
    #game{position:relative;width:min(1280px,100vw);height:min(720px,100vh);overflow:hidden;background:#17191b url("../Case67/Chapter_7/Media/Chapter7_Background.png") center/cover;margin:auto}
    #ground{position:absolute;left:0;right:0;bottom:0;height:78px;background:#101010;border-top:4px solid #68716b}
    #player,#boss{position:absolute;bottom:78px;height:78px;width:auto;image-rendering:pixelated;user-select:none;pointer-events:none;transform-origin:center bottom}
    #player{z-index:4} #boss{z-index:3}
    #hud{position:absolute;z-index:10;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font:24px Arial,sans-serif;text-shadow:2px 2px #000}
    #health{display:flex;gap:5px}.heart{width:30px;height:30px;object-fit:contain}
    #meteor,#hazard{position:absolute;display:none;width:54px;height:54px;image-rendering:pixelated}
    #meteor{z-index:5} #hazard{z-index:2}
    #message{position:absolute;z-index:12;inset:45% 0 auto;text-align:center;font:26px Arial,sans-serif;text-shadow:2px 2px #000}
  </style>
</head>
<body>
  <main id="game">
    <div id="ground"></div>
    <img id="player" alt="Player">
    <img id="boss" src="../Media/Enemy/NicholasRenegade/Still.png" alt="Nicholas Renegade">
    <img id="meteor" src="../Media/Enemy/NicholasRenegade/Meteor.png" alt="Meteor">
    <img id="hazard" alt="Attack">
    <div id="hud"><div id="health"></div><div id="boss-health">BOSS 100 / 100</div></div>
    <div id="message" aria-live="polite"></div>
  </main>
  <script src="../player controls/player-controls.js"></script>
  <script>
    const game=document.getElementById("game"),player=document.getElementById("player"),boss=document.getElementById("boss");
    const meteor=document.getElementById("meteor"),hazard=document.getElementById("hazard"),health=document.getElementById("health"),bossHealthElement=document.getElementById("boss-health"),message=document.getElementById("message");
    const keys={left:false,right:false},asset="../Media/Enemy/NicholasRenegade/";
    let number=1,playerX=120,bossX=900,bossHealth=100,playerHealth=getStartingHealth(),facing=1,last=performance.now(),attackTimer=1.8,activeTell="",activeTimer=0,meteorCooldown=0,finished=false;
    function drawHealth(){health.replaceChildren();for(let i=0;i<getStartingHealth();i++){const heart=document.createElement("img");heart.className="heart";heart.src="../Media/Images/Heart.png";heart.alt=i<playerHealth?"Heart":"Empty heart";heart.style.opacity=i<playerHealth?"1":".2";health.appendChild(heart)}}
    function draw(){player.src=`../Media/Player/${number}/Standard/${number}_${playerHealth>0?(keys.left||keys.right?"Still":"Still"):"Still"}.png`;player.style.left=`${playerX}px`;player.style.transform=`translateX(-50%) scaleX(${facing})`;boss.style.left=`${bossX}px`;boss.style.transform=`translateX(-50%) scaleX(${bossX<playerX?-1:1})`;bossHealthElement.textContent=`BOSS ${bossHealth} / 100`}
    function tell(name){activeTell=name;activeTimer=.85;boss.src=asset+({BLUE:"Blue.png",RED:"Red.png",YELLOW:"Yellow.png",PURPLE:"Purple.png"}[name]||"Still.png")}
    function hurtPlayer(){if(finished)return;playerHealth--;drawHealth();if(playerHealth<=0){finished=true;message.textContent="DEFEATED"}}
    function resolveAttack(){
      const attack=activeTell;
      meteor.style.display="none";hazard.style.display="none";
      if(attack==="BLUE"){
        hazard.src=asset+"Present.png";hazard.style.display="block";hazard.style.left=`${bossX}px`;hazard.style.bottom="78px";
        window.setTimeout(()=>{if(!finished&&Math.abs(parseFloat(hazard.style.left)-playerX)<55)hurtPlayer();hazard.style.display="none"},500);
      }else if(attack==="YELLOW"){
        hazard.src=asset+"Sled.png";hazard.style.display="block";hazard.style.left=`${bossX}px`;hazard.style.bottom="78px";
        if(Math.abs(playerX-bossX)<140)hurtPlayer();
      }else if(attack==="PURPLE"){
        boss.src=asset+"Travel.png";bossX=playerX<game.clientWidth/2?game.clientWidth-140:140;
        if(Math.abs(playerX-bossX)<140)hurtPlayer();
        window.setTimeout(()=>boss.src=asset+"Still.png",500);
      }
      activeTell="";
      if(attack!=="PURPLE")boss.src=asset+"Still.png";
    }
    function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!finished){playerX+=((keys.right?1:0)-(keys.left?1:0))*300*dt;if(keys.left)facing=-1;if(keys.right)facing=1;playerX=Math.max(22,Math.min(game.clientWidth-22,playerX));attackTimer-=dt;meteorCooldown-=dt;if(activeTell&&activeTimer>0){activeTimer-=dt;if(activeTimer<=0)resolveAttack()}else if(attackTimer<=0){const tells=["BLUE","RED","YELLOW","PURPLE",""];tell(tells[Math.floor(Math.random()*tells.length)]||"STILL");attackTimer=3.1;if(activeTell==="")boss.src=asset+"Still.png"}if(activeTell==="RED"&&meteorCooldown<=0){meteorCooldown=.18;meteor.style.display="block";meteor.style.left=`${playerX+30*Math.sin(now/180)}px`;meteor.style.bottom=`${220+78*Math.cos(now/180)}px`;if(Math.abs(parseFloat(meteor.style.left)-playerX)<55)hurtPlayer()}draw();requestAnimationFrame(loop)}}
    addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k=== "a"||k=== "arrowleft")keys.left=true;if(k=== "d"||k=== "arrowright")keys.right=true;if(k=== " "&&!e.repeat&&Math.abs(playerX-bossX)<110&&bossHealth>0){bossHealth=Math.max(0,bossHealth-1);if(bossHealth===0){finished=true;message.textContent="VICTORY"}draw()}});
    addEventListener("keyup",e=>{const k=e.key.toLowerCase();if(k=== "a"||k=== "arrowleft")keys.left=false;if(k=== "d"||k=== "arrowright")keys.right=false});
    drawHealth();draw();requestAnimationFrame(loop);
  </script>
</body>
</html>
